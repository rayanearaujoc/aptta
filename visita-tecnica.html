<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Visita técnica — Tópicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --green-900:#0F6E56;
    --green-800:#0F6E56;
    --green-700:#1D9E75;
    --green-600:#1D9E75;
    --green-100:#e3f2ec;
    --green-50:#f5f5f5;
    --red-700:#b3352f;
    --red-100:#fbe4e2;
    --red-50:#fdf2f1;
    --ink-900:#181b19;
    --ink-700:#4d534f;
    --ink-500:#7c8480;
    --ink-300:#c7ccc8;
    --line:#e7e8e4;
    --paper:#f5f5f5;
    --card:#ffffff;
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:9px;
    --shadow-card:0 1px 2px rgba(24,27,25,0.05), 0 1px 1px rgba(24,27,25,0.03);
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    background:#ffffff;
    font-family:'Open Sans',sans-serif;
    color:var(--ink-900);
    display:flex;
    justify-content:center;
  }
  svg.icon{ display:block; flex-shrink:0; }
  button{ font-family:'Open Sans',sans-serif; cursor:pointer; }

  .app{
    width:100%;
    max-width:430px;
    height:100dvh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }

  /* ---------- header ---------- */
  .header{
    background:var(--card);
    color:var(--ink-900);
    padding:calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
    flex-shrink:0;
    border-bottom:1px solid var(--line);
  }
  .header-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .back{ display:flex; align-items:center; gap:4px; font-size:13px; font-weight:600; color:var(--ink-700); }
  .status{ display:flex; align-items:center; gap:5px; background:var(--green-50); padding:3px 9px 3px 7px; border-radius:100px; font-size:11px; font-weight:600; color:var(--green-800); }
  .dot{ width:5px; height:5px; border-radius:50%; background:var(--green-600); }
  .header-bottom{ display:flex; align-items:baseline; justify-content:space-between;}
  .header-meta{ font-size:11px; color:var(--ink-500); margin:0 0 1px; font-weight:500; }
  .header-client{ font-family:'Playfair Display',serif; font-size:15px; font-weight:600; margin:0; letter-spacing:-0.1px; color:var(--ink-900); }

  /* ---------- body (scroll area) ---------- */
  .body{ flex:1; overflow-y:auto; padding:16px 16px 24px; -webkit-overflow-scrolling:touch; scroll-behavior:smooth; }

  .topic{ background:var(--card); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); margin-bottom:12px; overflow:hidden; scroll-margin-top:12px; }
  .topic-summary{ display:flex; align-items:center; justify-content:space-between; padding:16px; cursor:pointer; }
  .topic-summary-left{ display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .chevron{ color:var(--ink-700); flex-shrink:0; }
  .topic-title-text{ font-family:'Open Sans',sans-serif; font-size:16px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .topic-title-input{ font-family:'Open Sans',sans-serif; font-size:16px; font-weight:600; border:none; background:transparent; padding:0; flex:1; color:var(--ink-900); border-bottom:1px solid var(--green-600); min-width:0; }
  .topic-title-input:focus{ outline:none; }
  .topic-summary-actions{ display:flex; align-items:center; gap:2px; flex-shrink:0; }
  .icon-btn{ border:none; background:transparent; color:var(--ink-500); padding:7px; cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:8px; }
  .icon-btn:active{ background:var(--green-50); color:var(--ink-900); }
  .icon-btn.danger:active{ color:var(--red-700); background:var(--red-50); }

  .topic-plan-indicator{ width:26px; height:26px; border-radius:50%; background:var(--green-700); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-right:2px; }
  .topic-note-indicator{ display:flex; align-items:center; flex-shrink:0; margin-right:2px; font-size:11.5px; font-weight:700; color:#fff; background:var(--green-700); padding:4px 9px; border-radius:100px; }

  .topic-body{ padding:0 16px 16px; border-top:1px solid var(--line); }

  .observation{ padding-top:14px; }

  /* ---------- campo de texto grande ---------- */
  .field-wrap{ position:relative; }
  textarea.obs-input{
    width:100%; min-height:96px; resize:vertical; border:1px solid var(--line); border-radius:var(--radius-md);
    padding:14px 16px 54px; font-family:'Open Sans',sans-serif; font-size:14px; line-height:1.5; color:var(--ink-900);
    background:#ffff;
    transition:padding-bottom .15s ease;
  }
  /* mais respiro entre o texto e a barra de ações, só quando já tem conteúdo digitado
     (:placeholder-shown só é verdadeiro quando o campo está vazio mostrando o placeholder) */
  textarea.obs-input:not(:placeholder-shown){ padding-bottom:70px; }
  textarea.obs-input::placeholder{ color:var(--ink-500); }
  textarea.obs-input:focus{ outline:none; border-color:var(--green-600); background:var(--green-50); }

  /* linha de controles (mic + câmera) fica DENTRO da caixa, sobreposta na base do campo */
  .field-actions-row{
    position:absolute; left:12px; right:12px; bottom:12px;
    display:flex; align-items:center; justify-content:flex-end; gap:10px;
    pointer-events:none;
  }
  .field-actions-row > *{ pointer-events:auto; }

  .listening{ font-size:12px; color:var(--green-600); margin:8px 2px 0; display:flex; align-items:center; gap:5px; }
  .listening span.wave{ width:5px; height:5px; border-radius:50%; background:var(--green-600); animation:blink 1s infinite ease-in-out; }
  @keyframes blink{ 0%,100%{ opacity:.3; } 50%{ opacity:1; } }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(29, 158, 117, 0.35); } 50%{ box-shadow:0 0 0 7px rgba(29, 158, 117,0); } }

  .photo-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .photo-thumb{ width:56px; height:56px; border-radius:10px; position:relative; overflow:hidden; background:linear-gradient(135deg, #cfd8d3, #9fb0a8); display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.85); flex-shrink:0; }
  .photo-thumb .remove-photo{ position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:50%; background:rgba(15,20,18,0.75); border:none; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .photo-add-tile{ width:56px; height:56px; border-radius:10px; border:1.5px dashed var(--green-600); background:transparent; color:var(--green-700); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .photo-add-tile:active{ background:var(--green-50); }

  .action-btn{
    display:flex; align-items:center; gap:10px; width:100%;
    border:1px solid var(--line); border-radius:var(--radius-md);
    background:#fff; padding:14px 16px;
    font-size:14px; font-weight:600; color:var(--ink-700);
    text-align:left;
  }
  .action-btn:not(:disabled):active{ border-color:var(--green-600); }
.plan-generate-btn{
  position:relative; display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  border:1px solid transparent; border-radius:var(--radius-sm);
  background:
    linear-gradient(#fff, #fff) padding-box,
    linear-gradient(120deg, var(--green-600), var(--green-100), var(--green-600)) border-box;
  background-size: 100% 100%, 220% 220%;
  color:var(--green-700); font-size:13.5px; font-weight:700; padding:13px 16px; text-align:center;
  animation: ai-border-shift 4s ease-in-out infinite;
}
.plan-generate-btn:active{
  background:
    linear-gradient(var(--green-50), var(--green-50)) padding-box,
    linear-gradient(120deg, var(--green-600), var(--green-100), var(--green-600)) border-box;
}
@keyframes ai-border-shift{
  0%, 100%{ background-position: 0 0, 0% 50%; }
  50%{ background-position: 0 0, 100% 50%; }
}
  .plan-generate-btn:disabled{ color:var(--ink-300); border:1px solid #e5e5e5; cursor:not-allowed; background:#fff; animation:none; }
  .plan-generate-btn .sparkle-icon-wrap{ display:flex; flex-shrink:0; color:var(--green-600); animation:sparkle-twinkle 1.8s ease-in-out infinite; }
  .plan-generate-btn:disabled .sparkle-icon-wrap{ animation:none; color:var(--ink-300); }
  @keyframes sparkle-twinkle{
    0%, 100%{ transform:scale(1) rotate(0deg); opacity:1; }
    50%{ transform:scale(1.2) rotate(12deg); opacity:.7; }
  }

  .obs-media-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .media-btn{
    position:relative; width:40px; height:40px; border-radius:50%; border:none;
    background:#EFEFEF; color:var(--ink-700); display:flex; align-items:center; justify-content:center;
    transition:background .15s ease, color .15s ease; flex-shrink:0;
    box-shadow:0 1px 2px rgba(24,27,25,0.08);
  }
  .media-btn:active{ background:#e2e2e2; }
  .media-btn.recording{ background:var(--green-600); color:#fff; animation:pulse 1.1s ease-in-out infinite; }
  .media-badge{
    position:absolute; bottom:-3px; right:-3px; min-width:16px; height:16px; padding:0 4px;
    border-radius:8px; background:var(--green-700); color:#fff; font-size:9.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center; border:2px solid #fff;
  }

  /* ---------- loading do plano de ação ---------- */
  .plan-loading{
    display:flex; align-items:center; gap:9px;
    padding:14px 16px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius-md);
  }
  .plan-loading .spinner{
    width:15px; height:15px; flex-shrink:0; border-radius:50%;
    border:2px solid var(--green-100);
    border-top-color:var(--green-600);
    animation:spin .8s linear infinite;
  }
  .plan-loading .sparkle{ display:flex; flex-shrink:0; color:var(--green-600); }
  .plan-loading span{ font-size:13.5px; font-weight:600; color:var(--green-800); }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- chip compacto do plano ---------- */
  .plan-chip{
    display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
    padding:12px 14px; border:none; border-radius:var(--radius-md);
    background:var(--green-50); text-align:left;
  }
  .plan-chip:active{ background:var(--green-100); }
  .plan-chip-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .plan-chip-icon{ width:34px; height:34px; border-radius:10px; background:var(--green-700); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .plan-chip-text{ font-size:13.5px; font-weight:700; color:var(--ink-900); margin:0; }
  .plan-chip-sub{ font-size:12px; color:var(--ink-500); margin:1px 0 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .plan-chip-chevron{ color:var(--ink-500); flex-shrink:0; }

  /* ---------- bottom sheet do plano de ação ---------- */
  .sheet-overlay{ position:absolute; inset:0; background:rgba(10,20,15,0.45); display:flex; align-items:flex-end; z-index:30; }
  .sheet-panel{
    background:var(--card); width:100%; max-height:86%; border-radius:20px 20px 0 0;
    display:flex; flex-direction:column; box-shadow:0 -6px 28px rgba(0,0,0,0.18);
    animation:sheet-up .22s ease-out; overflow:hidden;
  }
  @keyframes sheet-up{ from{ transform:translateY(28px); opacity:.5; } to{ transform:translateY(0); opacity:1; } }
  .sheet-handle{ width:36px; height:4px; background:rgba(255,255,255,0.4); border-radius:2px; margin:0 auto 12px; flex-shrink:0; }
  .sheet-header{ display:flex; flex-direction:column; padding:10px 16px 16px; background:var(--green-900); flex-shrink:0; }
  .sheet-header-row{ display:flex; align-items:flex-start; justify-content:space-between; }
  .sheet-title-wrap{ display:flex; align-items:center; gap:10px; min-width:0; }
  .sheet-title-col{ min-width:0; }
  .sheet-title{ font-family:'Playfair Display',serif; font-weight:600; font-size:16px; color:#fff; margin:0; }
  .sheet-icon-box{ display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; }
  .sheet-topic-sub{ font-size:12px; color:rgba(255,255,255,0.78); margin:4px 0 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sheet-header-actions{ display:flex; align-items:center; gap:2px; flex-shrink:0; }
  .sheet-close{ border:none; background:rgba(255,255,255,0.18); color:#fff; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .sheet-close:active{ background:rgba(255,255,255,0.3); }
  .sheet-back-row{ padding:10px 16px 0; flex-shrink:0; }
  .step-content{ animation: step-fade-in .28s ease; }
  @keyframes step-fade-in{
    from{ opacity:0; transform:translateX(10px); }
    to{ opacity:1; transform:translateX(0); }
  }
  .step-back-link{ display:flex; align-items:center; gap:4px; border:none; background:transparent; color:var(--ink-700); font-size:13px; font-weight:600; padding:11px 4px; flex-shrink:0; }
  .sheet-body{ padding:16px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .sheet-footer{ padding:12px 16px calc(env(safe-area-inset-bottom, 0px) + 12px); border-top:1px solid var(--line); flex-shrink:0; background:var(--card); }

  .sheet-loading{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:36px 20px 24px; text-align:center; }
  .sheet-loading .spinner-lg{ width:28px; height:28px; border-radius:50%; border:3px solid var(--green-100); border-top-color:var(--green-600); animation:spin .8s linear infinite; }
  .sheet-loading p{ font-size:13.5px; color:var(--ink-700); margin:0; line-height:1.5; }

  .plan-field{ margin-bottom:20px; }
  .plan-label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-700); margin-bottom:6px; }
  .plan-field-label-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
  .plan-field-label-row .plan-label{ margin-bottom:0; }
  .plan-ai-badge{ display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:600; color:var(--green-900); background:#EAF2EF; padding:5px 11px; border-radius:100px; white-space:nowrap; flex-shrink:0; }
  .plan-ai-badge svg{ flex-shrink:0; }
  .plan-ai-badge.edited{ color:var(--ink-500); background:#EFEFEF; }
  textarea.plan-input{ width:100%; min-height:96px; resize:vertical; border:1px solid var(--line); border-radius:var(--radius-md); padding:12px 14px; font-family:'Open Sans',sans-serif; font-size:14px; line-height:1.6; color:var(--ink-900); background:#fff; transition:background .15s ease, border-color .15s ease; }
  textarea.plan-input.ai-suggested{ background:var(--green-50); }
  textarea.plan-input:focus{ outline:none; border-color:var(--green-600); }
  .plan-restore{ display:inline-flex; align-items:center; gap:5px; border:none; background:transparent; color:var(--green-700); font-size:12.5px; font-weight:700; padding:0; margin:-8px 0 16px; }
  .plan-dates{ display:flex; flex-direction:column; gap:12px; margin-bottom:2px; }
  .plan-date-field{ width:100%; }
  .date-input-wrap{ position:relative; width:100%; }
  input.date-input{
    width:100%; box-sizing:border-box; height:44px; border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:0 40px 0 12px; background:#fff; font-family:'Open Sans',sans-serif; font-size:14px; color:var(--ink-900);
  }
  input.date-input::placeholder{ color:var(--ink-500); }
  input.date-input:focus{ outline:none; border-color:var(--green-600); }
  .date-input-wrap svg{ position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--ink-500); pointer-events:none; }
  .plan-warning{ font-size:12px; color:var(--red-700); margin:10px 0 0; }
  .plan-actions{ margin-top:16px; }
  .plan-btn{ width:100%; padding:12px; border-radius:var(--radius-sm); font-size:13.5px; font-weight:700; border:1px solid var(--line); background:#fff; color:var(--ink-700); }
  .plan-btn.plan-confirm{ border:none; background:var(--green-600); color:#fff; }
  .plan-btn:disabled{ opacity:.45; cursor:not-allowed; }

  .plan-actions-row{ display:flex; align-items:center; gap:10px; }
  .plan-actions-row .plan-btn{ width:auto; flex:1; }
  .plan-actions-row .step-back-link{ flex:0 0 auto; }
  .plan-btn.plan-delete{ display:flex; align-items:center;  border:1px solid var(--red-700); justify-content:center; gap:6px; color:var(--red-700); background:transparent;}
.plan-btn.plan-delete:active{ color:var(--red-700); background:transparent; }

  .plan-summary{ display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md); padding:12px 14px; }
  .plan-summary-icon{ width:36px; height:36px; border-radius:10px; background:var(--green-700); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .plan-summary-text{ flex:1; min-width:0; }
  .plan-summary-title{ font-size:13.5px; font-weight:700; color:var(--ink-900); margin:0; }
  .plan-summary-desc{ font-size:12px; color:var(--ink-500); font-style:italic; margin:2px 0 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .plan-edit-link{ border:none; background:transparent; color:var(--green-700); font-size:13px; font-weight:700; padding:4px; flex-shrink:0; }

  /* ---------- rodapé do tópico: plano de ação + nota geral, num bloco só ---------- */
  .topic-footer-section{ margin-top:18px; padding-top:16px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:18px; }

  /* ---------- nota geral do tópico (escala 0-10 numa barra única, sem legenda) ---------- */
  .topic-note-label{ font-size:13px; font-weight:600; color:var(--ink-900); margin:0 0 10px; }
  .topic-note-scale{ display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .topic-note-cell{ flex:1; border:none; border-right:1px solid var(--line); background:#fff; color:var(--ink-700); font-size:12px; font-weight:400; padding:10px 0; text-align:center; }
  .topic-note-cell:last-child{ border-right:none; }
  .topic-note-cell.selected{ background:var(--green-900); color:#fff; }

  .add-topic{ width:100%; padding:14px; border:1.5px dashed var(--green-600); border-radius:var(--radius-lg); background:transparent; color:var(--green-800); font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:7px; }

  .empty-hint{ text-align:center; color:var(--ink-500); font-size:13px; padding:40px 20px; line-height:1.6; }

  /* ---------- footer ---------- */
  .footer{ flex-shrink:0; padding:12px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); background:var(--paper); border-top:1px solid var(--line); }
  .review-btn{ width:100%; padding:15px; border:none; border-radius:12px; background:var(--green-700); color:#fff; font-size:15px; font-weight:700; }
  .review-btn:disabled{ background:var(--ink-300); color:#fff; cursor:not-allowed; }

  /* ---------- modal ---------- */
  .modal-overlay{ position:absolute; inset:0; background:rgba(10,20,15,0.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:40; }
  .modal-card{ background:var(--card); border-radius:var(--radius-lg); padding:20px; width:100%; max-width:320px; }
  .modal-title{ font-family:'Playfair Display',serif; font-size:16px; font-weight:700; margin:0 0 8px; }
  .modal-text{ font-size:13.5px; color:var(--ink-700); line-height:1.5; margin:0 0 18px; }
  .modal-actions{ display:flex; gap:10px; }
  .modal-actions button{ flex:1; padding:11px; border-radius:var(--radius-sm); font-size:13.5px; font-weight:700; border:1px solid var(--line); background:#fff; color:var(--ink-700); }
  .modal-actions .btn-danger{ border:none; background:var(--red-700); color:#fff; }

  /* ---------- tela de revisão ---------- */
  .review-overlay{ position:absolute; inset:0; z-index:20; background:var(--paper); display:flex; flex-direction:column; }
  .review-header{ background:var(--green-900); padding:calc(env(safe-area-inset-top, 0px) + 12px) 16px 14px; flex-shrink:0; }
  .review-header-top{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .review-back{ display:flex; align-items:center; gap:4px; border:none; background:transparent; color:rgba(255,255,255,0.85); font-size:13px; font-weight:600; padding:4px 4px 4px 0; }
  .review-title{ font-family:'Playfair Display',serif; font-size:17px; font-weight:600; color:#fff; margin:0; }
  .review-stats{ display:flex; gap:8px; flex-wrap:nowrap; margin-top:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .review-stats::-webkit-scrollbar{ display:none; }
  .review-stat{ background:rgba(255,255,255,0.16); color:#fff; font-size:11px; font-weight:600; padding:4px 9px; border-radius:100px; flex-shrink:0; white-space:nowrap; }
  .review-body{ flex:1; overflow-y:auto; padding:16px; -webkit-overflow-scrolling:touch; }

  .review-unanswered-banner{ display:flex; align-items:center; gap:12px; background:var(--card); color:var(--ink-900); border-radius:var(--radius-md); padding:14px; margin-bottom:24px; box-shadow:var(--shadow-card); }

/* ---------- state ----------

let lastUsedEndDate = '';        // última data de conclusão confirmada — usada para pré-preencher o próximo plano de ação

/* Quantidade mínima de caracteres na nota do tópico pra liberar o "Gerar plano de ação" */
const MIN_CHARS_FOR_PLAN = 15;

function findTopic(id){ return topics.find(t => t.id == id); }

/* ---------- captura/seleção de foto real ---------- */
function openPhotoPicker(topicId){
  pendingPhotoTopicId = topicId;
  const input = document.getElementById('photo-file-input');
  input.value = '';
  input.click();
}

function readFileAsDataUrl(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('photo-file-input').addEventListener('change', (e) => {
  const files = Array.from(e.target.files || []);
  const topic = findTopic(pendingPhotoTopicId);
  if (!topic || files.length === 0) return;

  Promise.all(files.map(readFileAsDataUrl)).then(dataUrls => {
    topic.photos = topic.photos.concat(dataUrls);
    render();
  });
});

function pad2(n){ return String(n).padStart(2,'0'); }

function todayDisplay(){
  const d = new Date();
  return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`;
}

function maskDateInput(raw){
  const digits = (raw || '').replace(/\D/g, '').slice(0, 8);
  const day = digits.slice(0, 2);
  const month = digits.slice(2, 4);
  const year = digits.slice(4, 8);
  let out = day;
  if (digits.length > 2) out += '/' + month;
  if (digits.length > 4) out += '/' + year;
  return out;
}

function parseDisplayDate(str){
  const m = /^(\d{2})\/(\d{2})\/(\d{2}|\d{4})$/.exec((str || '').trim());
  if (!m) return null;
  const day = Number(m[1]), month = Number(m[2]) - 1;
  const year = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]);
  const date = new Date(year, month, day);
  if (date.getFullYear() !== year || date.getMonth() !== month || date.getDate() !== day) return null;
  return date;
}

function generateAISuggestion(){
  return {
    whatToFix: 'Reorganizar o armazenamento seguindo o padrão FIFO, separando itens por validade.',
    howToFix: 'Treinar a equipe e reetiquetar as prateleiras com data de validade visível.'
  };
}

function startPlanGeneration(topic){
  topic.planState = 'generating';
  activePlanSheet = { topicId: topic.id };
  planSheetStep = 'text';
  planTextWarning = false;
  render();
  setTimeout(() => {
    const suggestion = generateAISuggestion();
    topic.plan = {
      whatToFix: suggestion.whatToFix,
      howToFix: suggestion.howToFix,
      aiWhatToFix: suggestion.whatToFix,
      aiHowToFix: suggestion.howToFix,
      savedWhatToFix: suggestion.whatToFix,
      savedHowToFix: suggestion.howToFix,
      startDate: todayDisplay(),
      endDate: lastUsedEndDate,
      savedStartDate: todayDisplay(),
      savedEndDate: lastUsedEndDate,
      dateError: false
    };
    topic.planState = 'editing';
    render();
  }, 900);
}

/* ---------- render ---------- */
function render(){
  renderTopics();
  renderModal();
  document.getElementById('review-btn').disabled = topics.length === 0;

  if (pendingScrollTopicId !== null){
    const id = pendingScrollTopicId;
    pendingScrollTopicId = null;
    const node = document.getElementById(`topic-${id}`);
    if (node){
      requestAnimationFrame(() => {
        node.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }
  }

  renderPlanSheet();
  renderReviewRoot();
}

function openPlanSheet(topicId){
  activePlanSheet = { topicId };
  planSheetStep = 'text';
  planTextWarning = false;
  render();
}

function closePlanSheet(){
  if (activePlanSheet){
    const topic = findTopic(activePlanSheet.topicId);
    if (topic && topic.planState !== 'confirmed'){
      topic.planState = 'none';
      topic.plan = null;
      topic.planMissingFieldsWarning = false;
    } else if (topic && topic.planState === 'confirmed' && topic.plan){
      // descarta edições não salvas ao fechar sem salvar
      const plan = topic.plan;
      plan.whatToFix = plan.savedWhatToFix;
      plan.howToFix = plan.savedHowToFix;
      plan.startDate = plan.savedStartDate;
      plan.endDate = plan.savedEndDate;
      plan.dateError = false;
      topic.planMissingFieldsWarning = false;

function escapeHtml(str){

}

/* ================= TELA DE REVISÃO / RELATÓRIO ================= */

function buildReportLines(){
  const lines = [];
  lines.push('RELATÓRIO DE VISITA TÉCNICA');
  lines.push('Cliente: Padaria Central');
  lines.push(`Data da visita: ${todayDisplay()}`);
  lines.push('');
  topics.forEach((topic, ti) => {
    lines.push(`${ti + 1}. ${topic.title}`);
    if (topic.topicNote !== null){
      lines.push(`  Nota geral do tópico: ${topic.topicNote}/10`);
    }
    lines.push(`  Nota: ${topic.text.trim() || '(sem conteúdo)'}`);
    if (topic.photos.length){
      lines.push(`    ${topic.photos.length} foto(s) anexada(s)`);
    }
    if (topic.planState === 'confirmed' && topic.plan){
      lines.push(`  Plano de ação — O que corrigir: ${topic.plan.whatToFix}`);
      lines.push(`  Como será corrigido: ${topic.plan.howToFix}`);
      lines.push(`  Prazo: ${topic.plan.startDate} a ${topic.plan.endDate}`);
    }
    lines.push('');
  });
  if (review.finalNotes.trim()){
    lines.push('Considerações finais:');
    lines.push(review.finalNotes.trim());
    lines.push('');
  }
  lines.push(`Assinado digitalmente por ${review.consultantName} em ${new Date().toLocaleString('pt-BR')}`);
  return lines;
}

function generatePdfBlob(){
  const lines = buildReportLines();
  try{
    if (!(window.jspdf && window.jspdf.jsPDF)) throw new Error('jsPDF indisponível');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = 20;
    doc.setFontSize(11);
    lines.forEach(line => {
      const wrapped = doc.splitTextToSize(line === '' ? ' ' : line, 180);
      wrapped.forEach(w => {
        if (y > 280){ doc.addPage(); y = 20; }
        doc.text(w, 14, y);
        y += 6;
      });
    });
    pdfBlob = doc.output('blob');
  } catch(e){
    // ambiente sem acesso ao jsPDF (ex.: offline) — cai para um arquivo de texto simples
    pdfBlob = new Blob([lines.join('\n')], { type: 'text/plain' });
  }
  pdfBlobUrl = URL.createObjectURL(pdfBlob);
}

function downloadPdf(){
  if (!pdfBlobUrl) return;
  const isPdf = pdfBlob && pdfBlob.type === 'application/pdf';
  const a = document.createElement('a');
  a.href = pdfBlobUrl;
  a.download = isPdf ? 'relatorio-visita-tecnica.pdf' : 'relatorio-visita-tecnica.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function shareReport(){
  if (!pdfBlob) return;
  const isPdf = pdfBlob.type === 'application/pdf';
  const filename = isPdf ? 'relatorio-visita-tecnica.pdf' : 'relatorio-visita-tecnica.txt';
  if (navigator.canShare){
    try{
      const file = new File([pdfBlob], filename, { type: pdfBlob.type });
      if (navigator.canShare({ files: [file] })){
        await navigator.share({ files: [file], title: 'Relatório de Visita Técnica' });
        return;
      }
    } catch(e){ /* usuário cancelou o compartilhamento nativo */ }
  }
  downloadPdf();
}

  if (backBtn) backBtn.onclick = () => { currentScreen = 'main'; render(); };

  const previewBackBtn = document.getElementById('preview-back-btn');
  if (previewBackBtn) previewBackBtn.onclick = () => {
    if (pdfBlobUrl){ URL.revokeObjectURL(pdfBlobUrl); pdfBlobUrl = null; pdfBlob = null; }
    currentScreen = 'review';
    render();
  };

  const finalNotes = document.getElementById('review-final-notes');
  if (finalNotes) finalNotes.oninput = () => { review.finalNotes = finalNotes.value; };

  document.querySelectorAll('.review-topic-clickable').forEach(card => {
    card.onclick = () => goToTopicFromReview(card.dataset.topic);
  });

  const bannerBtn = document.querySelector('[data-action="goto-first-empty"]');
  if (bannerBtn){
    bannerBtn.onclick = (e) => {
      e.stopPropagation();
      const topic = topics.find(t => !t.text.trim());
      if (topic) goToTopicFromReview(topic.id);
    };
  }

  document.querySelectorAll('[data-action="open-plan-sheet"]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      currentScreen = 'main';
      openPlanSheet(btn.dataset.topic);
    };
  });

  document.querySelectorAll('[data-action="goto-plan"]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const topic = findTopic(btn.dataset.topic);
      if (topic) topic.open = true;
      currentScreen = 'main';
      pendingScrollTopicId = btn.dataset.topic;
      render();
    };
  });

  const genReportBtn = document.getElementById('generate-report-btn');
  if (genReportBtn) genReportBtn.onclick = () => {
    // TODO: a geração/envio real do relatório ainda não foi implementada.
    // Por enquanto, só mostramos o loading e voltamos para o index.
    currentScreen = 'generating-report';
    render();
    setTimeout(() => { window.location.href = 'index.html'; }, 1600);
  };

  const confirmBtn = document.getElementById('confirm-finalize-btn');
  if (confirmBtn) confirmBtn.onclick = () => {
    if (!pdfBlobUrl) return;
    downloadPdf();
    currentScreen = 'done';
    render();
  };

  const shareBtn = document.getElementById('share-report-btn');
  if (shareBtn) shareBtn.onclick = () => { shareReport(); };

  const backStartBtn = document.getElementById('back-to-start-btn');
  if (backStartBtn) backStartBtn.onclick = () => { currentScreen = 'main'; render(); };
}

function goToTopicFromReview(topicId){
  const topic = findTopic(topicId);
  if (topic) topic.open = true;
  currentScreen = 'main';
  render();
  setTimeout(() => {
    const el = document.getElementById(`topic-${topicId}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 50);
}

/* ---------- actions ---------- */
function addTopic(){
  topics.forEach(t => { t.open = false; t.editingTitle = false; });

  topicCounter++;
  const topic = {
    id: nextTopicId++, title:`Tópico ${topicCounter}`, open:true, editingTitle:false,
    text:'', photos:[], recording:false,
    topicNote:null,
    planState:'none', plan:null, planMissingFieldsWarning:false
  };
  topics.push(topic);

  pendingScrollTopicId = topic.id;
  render();
}

function bindTopicEvents(){
  document.querySelectorAll('.topic-note-cell').forEach(btn => {
    btn.onclick = () => {
      const topic = findTopic(btn.dataset.topic);
      const value = Number(btn.dataset.value);
      // clicar na nota que já estava marcada limpa a avaliação
      topic.topicNote = topic.topicNote === value ? null : value;
      render();
    };
  });

  document.querySelectorAll('.toggle-open').forEach(row => {
    row.onclick = (e) => {
      if (e.target.closest('.topic-title-input')) return;
      findTopic(row.dataset.topic).open = !findTopic(row.dataset.topic).open;
      render();
    };
  });
  document.querySelectorAll('.edit-title').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      findTopic(btn.dataset.topic).editingTitle = true;
      render();
      const inp = document.querySelector('.topic-title-input');
      if (inp){ inp.focus(); inp.select(); }
    };
  });
  document.querySelectorAll('.topic-title-input').forEach(inp => {
    inp.onclick = (e) => e.stopPropagation();
    inp.onblur = () => {
      const t = findTopic(inp.dataset.topic);
      t.title = inp.value.trim() || 'Novo tópico';
      t.editingTitle = false;
      render();
    };
    inp.onkeydown = (e) => { if (e.key === 'Enter') inp.blur(); };
  });
  document.querySelectorAll('.del-topic').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const t = findTopic(btn.dataset.topic);
      const hasContent = t.text.trim().length > 0;
      if (hasContent){
        deleteModalTopicId = btn.dataset.topic;
        render();
      } else {
        topics = topics.filter(x => x.id != t.id);
        render();
      }
    };
  });

  document.querySelectorAll('.obs-input').forEach(ta => {
    ta.oninput = () => {
      const topic = findTopic(ta.dataset.topic);
      topic.text = ta.value;
      // habilita/desabilita o botão "Gerar plano de ação" sem re-renderizar tudo (perderia o foco do textarea)
      const genBtn = document.getElementById(`gen-plan-${topic.id}`);
      if (genBtn) genBtn.disabled = topic.text.trim().length < MIN_CHARS_FOR_PLAN;
    };
  });
  document.querySelectorAll('.mic-btn').forEach(btn => {
    btn.onclick = () => {
      const topic = findTopic(btn.dataset.topic);
      topic.recording = true; render();
      setTimeout(() => {
        topic.text = (topic.text + ' Piso da câmara fria apresenta acúmulo de umidade próximo ao ralo.').trim();
        topic.recording = false;
        render();
      }, 1300);
    };
  });
  document.querySelectorAll('.add-images-btn').forEach(btn => {
    btn.onclick = () => { openPhotoPicker(btn.dataset.topic); };
  });
  document.querySelectorAll('.photo-add-tile').forEach(btn => {
    btn.onclick = () => { openPhotoPicker(btn.dataset.topic); };
  });
  document.querySelectorAll('.remove-photo').forEach(btn => {
    btn.onclick = () => {
      const topic = findTopic(btn.dataset.topic);
      topic.photos.splice(Number(btn.dataset.idx), 1); render();
    };
  });

  /* Botão "Gerar plano de ação": abre o bottom sheet e dispara a geração da sugestão da IA */
  document.querySelectorAll('[data-action="generate-plan"]').forEach(btn => {
    btn.onclick = () => {
      const topic = findTopic(btn.dataset.topic);
      if (!topic || topic.text.trim().length < MIN_CHARS_FOR_PLAN) return;
      startPlanGeneration(topic);
    };
  });

  const addTopicBtn = document.getElementById('add-topic-btn');
  if (addTopicBtn) addTopicBtn.onclick = addTopic;

  document.querySelectorAll('[data-action="open-plan-sheet"]').forEach(btn => {
    btn.onclick = () => openPlanSheet(btn.dataset.topic);
  });
}

function bindPlanEvents(){
  document.querySelectorAll('.plan-what, .plan-how').forEach(ta => {
    ta.oninput = () => {
      const topic = findTopic(ta.dataset.topic);
      if (!topic.plan) return;
      const isWhat = ta.classList.contains('plan-what');
      if (isWhat) topic.plan.whatToFix = ta.value;
      else topic.plan.howToFix = ta.value;

      const fieldChanged = isWhat
        ? topic.plan.whatToFix !== topic.plan.aiWhatToFix
        : topic.plan.howToFix !== topic.plan.aiHowToFix;
      ta.classList.toggle('ai-suggested', !fieldChanged);
      const badge = ta.closest('.plan-field').querySelector('.plan-ai-badge');
      if (badge){
        badge.classList.toggle('edited', fieldChanged);
        badge.innerHTML = `${ICON.sparkles(11)} ${fieldChanged ? 'Editado por você' : 'Sugestão da IA'}`;
      }

      const changedFromAI = topic.plan.whatToFix !== topic.plan.aiWhatToFix || topic.plan.howToFix !== topic.plan.aiHowToFix;
      const restoreBtn = document.getElementById(`restore-${topic.id}`);
      if (restoreBtn) restoreBtn.style.display = changedFromAI ? 'inline-flex' : 'none';

      if (planTextWarning && topic.plan.whatToFix.trim() && topic.plan.howToFix.trim()){
        planTextWarning = false;
        const warningEl = ta.closest('.sheet-body').querySelector('.plan-warning');
        if (warningEl) warningEl.remove();
      }

      updateSaveButtonState(topic);
    };
  });

  document.querySelectorAll('.plan-restore').forEach(btn => {
    btn.onclick = () => {
      const topic = findTopic(btn.dataset.topic);
      if (!topic.plan) return;
      topic.plan.whatToFix = topic.plan.aiWhatToFix;
      topic.plan.howToFix = topic.plan.aiHowToFix;
      render();
    };
  });

  document.querySelectorAll('.date-input').forEach(inp => {
    inp.oninput = () => {
      const topic = findTopic(inp.dataset.topic);
      if (!topic.plan) return;

      const formatted = maskDateInput(inp.value);
      inp.value = formatted;
      try { inp.setSelectionRange(formatted.length, formatted.length); } catch(e){}

      if (inp.dataset.field === 'start') topic.plan.startDate = formatted;
      else topic.plan.endDate = formatted;

      const start = parseDisplayDate(topic.plan.startDate);
      const end = parseDisplayDate(topic.plan.endDate);
      const hasError = !!(start && end && end < start);
      topic.plan.dateError = hasError;
      const warningEl = document.getElementById(`date-error-${topic.id}`);
      if (warningEl) warningEl.style.display = hasError ? 'block' : 'none';
      if (topic.planMissingFieldsWarning && topic.plan.whatToFix.trim() && topic.plan.howToFix.trim() && topic.plan.startDate.trim() && topic.plan.endDate.trim()){
        topic.planMissingFieldsWarning = false;
      }

      updateSaveButtonState(topic);
    };
  });

  document.querySelectorAll('[data-action="delete-plan"]').forEach(btn => {
    btn.onclick = () => {
      deletePlanTarget = btn.dataset.topic;
      render();
    };
  });

  document.querySelectorAll('[data-action="cancel-plan"]').forEach(btn => {
    btn.onclick = () => closePlanSheet();
  });

  document.querySelectorAll('[data-action="next-step"]').forEach(btn => {
    btn.onclick = () => {
      const topic = findTopic(btn.dataset.topic);
      if (!topic.plan) return;
      if (!topic.plan.whatToFix.trim() || !topic.plan.howToFix.trim()){
        planTextWarning = true;
        render();
        return;
      }
      planTextWarning = false;
      planSheetStep = 'dates';
      render();
    };
  });

  document.querySelectorAll('[data-action="prev-step"]').forEach(btn => {
    btn.onclick = () => {
      planSheetStep = 'text';
      render();
    };
  });

  document.querySelectorAll('[data-action="confirm-plan"]').forEach(btn => {
    btn.onclick = () => {
      const topic = findTopic(btn.dataset.topic);
      if (!topic.plan) return;
      const plan = topic.plan;

      const missing = !plan.whatToFix.trim() || !plan.howToFix.trim() || !plan.startDate.trim() || !plan.endDate.trim();
      if (missing){
        topic.planMissingFieldsWarning = true;
        plan.dateError = false;
        render();
        return;
      }

      const startDate = parseDisplayDate(plan.startDate);
      const endDate = parseDisplayDate(plan.endDate);
      if (!startDate || !endDate){
        topic.planMissingFieldsWarning = true;
        plan.dateError = false;
        render();
        return;
      }
      if (endDate < startDate){
        topic.planMissingFieldsWarning = false;
        plan.dateError = true;
        render();
        return;
      }

      topic.planMissingFieldsWarning = false;
      plan.dateError = false;
      plan.savedWhatToFix = plan.whatToFix;
      plan.savedHowToFix = plan.howToFix;
      plan.savedStartDate = plan.startDate;
      plan.savedEndDate = plan.endDate;
      lastUsedEndDate = plan.savedEndDate; // memoriza pra pré-preencher o próximo plano de ação
      topic.planState = 'confirmed';
      activePlanSheet = null; // salvo: fecha o sheet e volta pro resumo compacto
      render();
    };
  });
}

document.getElementById('review-btn').onclick = () => {
  if (topics.length === 0) return;
  currentScreen = 'review';
  render();
};

render();
</script>
