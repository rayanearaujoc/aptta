  .rep .r-sig-block{margin-top:16px;}
  .rep .r-sig-block + .r-sig-block{margin-top:22px;padding-top:18px;border-top:1px solid #e4e6e2;}
  .rep .r-sig-heading{font-size:11px;font-weight:700;margin:0 0 10px;}
  .rep .r-sig-preview{font-family:'Playfair Display',serif;font-style:italic;font-size:17px;border-bottom:1px solid #c7ccc8;padding-bottom:5px;margin-bottom:8px;min-height:22px;}
  .rep .r-sig-blank-line{height:36px;border-bottom:1px solid #c7ccc8;margin-bottom:8px;}
  .rep .r-sig-printed-name{font-size:12.5px;font-weight:700;margin:0 0 10px;}
  .rep .r-sig-printed-name.placeholder{color:#7c8480;font-weight:600;font-style:italic;}
  .rep .r-sig-role{font-size:10px;color:#7c8480;margin:0;}
`;
(function injectReportCss(){ const st=document.createElement('style'); st.textContent=REPORT_CSS; document.head.appendChild(st); })();

function nowDisplay(){ const d=new Date(); return `${todayDisplay()} às ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }

function reportPages(preview){
  const topics=reviewTopics(), st=stats(topics), gen=nowDisplay();
  const consultant = S.sig.consultantName || 'Consultora';
  const cover = `
    <div class="r-page ${preview && !S.coverOn ? 'r-page-excluded' : ''}">
      ${preview ? `<button class="r-page-toggle ${S.coverOn?'checked':''}" data-action="page-toggle" aria-pressed="${S.coverOn}"><span class="r-page-toggle-box">${S.coverOn?ICON.ok24():''}</span><span class="r-page-toggle-label">Incluir no PDF</span></button>` : ''}
      <p class="r-consult-name">${escapeHtml(consultant)}</p>
      <p class="r-consult-sub">Consultoria em Segurança Alimentar</p>
      <p class="r-eyebrow">RELATÓRIO DE VISITA TÉCNICA</p>
      <h1 class="r-title">${escapeHtml(CLIENT_NAME)}</h1>
      <div class="r-meta-grid">
        <div class="r-meta-item"><p class="k">Cliente</p><p class="v">${escapeHtml(CLIENT_NAME)}</p></div>
        <div class="r-meta-item"><p class="k">Data da visita</p><p class="v r-num">${todayDisplay()}</p></div>
        <div class="r-meta-item"><p class="k">Responsável técnico</p><p class="v">${escapeHtml(consultant)}</p></div>
      </div>
      <div class="r-summary">
        <div class="r-summary-card"><span class="num r-num">${st.nTopics}</span><p class="lbl">Tópicos</p></div>
        <div class="r-summary-card"><span class="num r-num">${st.nItems}</span><p class="lbl">Apontam.</p></div>
        <div class="r-summary-card"><span class="num r-num">${st.nPlans}</span><p class="lbl">Planos</p></div>
        ${st.avg!==null?`<div class="r-summary-card pct"><span class="num r-num">${fmtAvg(st.avg)}</span><p class="lbl">Nota média</p></div>`:''}
      </div>
      ${topics.some(t=>t.grade!==null)?`<div class="r-chart-box">
        <h4>Nota por tópico</h4>
        <div class="r-bar-list">
          ${topics.filter(t=>t.grade!==null).map(t=>`<div><div class="r-bar-head"><p class="cat-label">${escapeHtml(t.name)}</p><span class="bar-pct r-num">${t.grade}/10</span></div>
            <div class="r-bar-track"><div class="r-bar-fill" style="width:${t.grade*10}%;"></div></div></div>`).join('')}
        </div>
      </div>`:''}
      <div class="r-footer"><span class="r-footer-tag">Documento gerado em <span class="r-num">${gen}</span></span><span class="r-footer-tag">gerado com <b>aptta</b></span></div>
    </div>`;
  const body = `
    <div class="r-page">
      <h2 class="r-section-title">Apontamentos da visita</h2>
      <p class="r-intro">Registro do que foi observado em cada área, com as fotos e, quando houver, o plano de ação definido.</p>
      ${topics.map(t=>`
        <div class="r-category-title"><span>${escapeHtml(t.name)}</span>${t.grade!==null?`<span class="r-cat-grade">Nota ${t.grade}/10</span>`:''}</div>
        ${t.items.length ? t.items.map(i=>`<div class="r-item">
            ${i.text?`<p class="r-item-text">${escapeHtml(i.text)}</p>`:''}
            ${i.photos.length?`<div class="r-item-photos">${i.photos.map(src=>`<div class="ph" style="background-image:url('${src}')"></div>`).join('')}</div>`:''}
          </div>`).join('') : `<p class="r-empty">Sem apontamentos neste tópico.</p>`}
        ${t.planState==='confirmed'&&t.plan ? `<div class="r-plan-box"><div class="r-plan-rail"></div><div>
            <p class="r-plan-label">Plano de ação</p>
            <p class="r-plan-row"><span class="lbl">O que deve ser corrigido:</span> ${escapeHtml(t.plan.whatToFix)}</p>
            <p class="r-plan-row"><span class="lbl">Como será corrigido:</span> ${escapeHtml(t.plan.howToFix)}</p>
            <p class="r-plan-row"><span class="lbl">Responsável:</span> ${escapeHtml(responsibleLabel(t.plan.savedResponsible||t.plan.responsible))}</p>
            <div class="r-plan-dates-row"><p class="r-plan-row"><span class="lbl">Início:</span> <span class="r-num">${escapeHtml(t.plan.savedStartDate||'—')}</span></p><p class="r-plan-row"><span class="lbl">Conclusão:</span> <span class="r-num">${escapeHtml(t.plan.savedEndDate||'—')}</span></p></div>
          </div></div>` : ''}
      `).join('')}
    </div>`;
  const notes = S.notes.trim() ? `<div class="r-page"><h2 class="r-section-title">Considerações gerais</h2><p class="r-notes">${escapeHtml(S.notes.trim())}</p></div>` : '';
  return { cover, body, notes, gen };
}

function signaturesPage(gen){
  return `<div class="r-page"><h2 class="r-section-title">Assinaturas</h2>
    <div class="r-sig-block" style="margin-top:0;"><p class="r-sig-heading">Assinatura da consultora</p>
      <div class="r-sig-preview">${escapeHtml(S.sig.consultantName)||'&nbsp;'}</div><p class="r-sig-role">Consultora responsável</p></div>
    ${S.sig.includeClient?`<div class="r-sig-block"><p class="r-sig-heading">Assinatura do responsável pelo estabelecimento</p>
      <div class="r-sig-blank-line"></div>
      <p class="r-sig-printed-name ${S.sig.clientName?'':'placeholder'}">${S.sig.clientName?escapeHtml(S.sig.clientName):'Nome não informado'}</p>
      <p class="r-sig-role">Responsável pelo estabelecimento — espaço reservado para assinatura externa</p></div>`:''}
    <div class="r-footer"><span class="r-footer-tag">Documento gerado automaticamente em <span class="r-num">${gen}</span></span><span class="r-footer-tag">Gerado com <b>aptta</b></span></div>
  </div>`;
}

function previewHtml(){
  const p=reportPages(true);
  const sigCard=`<div class="report-sig-card rep">
    <p class="report-sig-card-title">Assinaturas</p>
    <p class="report-sig-card-sub">Esta é a área de assinatura do relatório. Confira os nomes antes de finalizar a visita.</p>
    <div class="r-sig-block" style="margin-top:0;"><p class="r-sig-heading">Assinatura da consultora</p>
      <div class="r-sig-preview" id="consultant-sig-preview">${escapeHtml(S.sig.consultantName)||'&nbsp;'}</div>
      <input type="text" class="r-sig-input" id="consultant-sig-input" value="${escapeHtml(S.sig.consultantName)}" placeholder="Nome da consultora">
      <p class="r-sig-role">Consultora responsável</p></div>
    <div class="r-sig-block"><p class="r-sig-heading">Assinatura do responsável pelo estabelecimento</p>
      <div class="r-sig-toggle-row">
        <button class="r-sig-toggle-btn ${!S.sig.includeClient?'selected':''}" data-action="sig-no">Não incluir</button>
        <button class="r-sig-toggle-btn ${S.sig.includeClient?'selected':''}" data-action="sig-yes">Incluir assinatura</button>
      </div>
      ${S.sig.includeClient?`<p style="font-size:11px;color:#7c8480;line-height:1.5;margin:2px 0 14px;">Isto só reserva um espaço em branco no PDF, com o nome impresso abaixo, para uma assinatura feita depois fora do app (ex: ClickSign, gov.br).</p>
        <div class="r-sig-blank-line"></div>
        <p class="r-sig-printed-name ${S.sig.clientName?'':'placeholder'}" id="client-sig-printed-name">${S.sig.clientName?escapeHtml(S.sig.clientName):'Nome não informado'}</p>
        <input type="text" class="r-sig-input" id="client-sig-input" value="${escapeHtml(S.sig.clientName)}" placeholder="Nome do responsável pelo estabelecimento">
        <p class="r-sig-role">Responsável pelo estabelecimento</p>`:''}
    </div></div>`;
  return `<div class="report-shell">
    <div class="report-topbar">
      <div class="review-header-top"><button class="review-back" data-action="report-back">${ICON.arrowLeft(15)} Voltar</button></div>
      <p class="report-topbar-title">Prévia do relatório</p>
    </div>
    <div class="report-pages rep">${p.cover}${p.body}${p.notes}${sigCard}</div>
    <div class="report-bottombar"><button data-action="finalize">${ICON.check(16)} Finalizar visita</button></div>
  </div>`;
}

function finalizeConfirmHtml(){
  return `<div class="pending-overlay"><div class="pending-card" role="dialog" aria-label="Finalizar visita">
    <p class="modal-title">Finalizar visita?</p>
    <p class="modal-text">Depois de finalizada, o relatório fica pronto para compartilhar com o cliente.</p>
    <div class="pending-actions">
      <button class="pending-go-btn" data-action="finalize-confirm">${ICON.check(16)} Finalizar visita</button>
      <button class="pending-fill-btn" data-action="finalize-cancel">Cancelar</button>
    </div></div></div>`;
}

function finalizedHtml(){
  return `<div class="finalized-shell">
    <div class="finalized-icon">${ICON.noteCheck(32)}</div>
    <p class="finalized-title">Visita finalizada</p>
    <p class="finalized-text">O relatório abriu numa nova aba do navegador. Por lá você pode imprimir ou salvar como PDF.${!PREV && S.saveTemplate ? ' Os tópicos desta visita foram salvos como modelo.' : ''}</p>
    <div class="finalized-actions">
      <button class="finalized-main" data-action="reopen-report">Abrir relatório novamente</button>
      <button class="pending-fill-btn" data-action="go-home">${ICON.arrowLeft(14)} Voltar ao início</button>
    </div></div>`;
}

/* relatório final, estático, aberto numa aba nova para imprimir / salvar como PDF */
function buildStandaloneReportHtml(){
  const p=reportPages(false);
  return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=1100">
<title>Relatório de visita técnica — ${escapeHtml(CLIENT_NAME)}</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#eeeeec;padding:28px 12px 90px;font-family:'Open Sans',sans-serif;}
  ${REPORT_CSS}
  /* um documento contínuo: as seções seguem uma embaixo da outra, sem forçar página nova */
  .doc{max-width:760px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.10);overflow:hidden;}
  .rep .doc .r-page{max-width:none;margin:0;border-radius:0;box-shadow:none;padding:32px 44px;}
  .rep .doc .r-page + .r-page{border-top:1px solid #e4e6e2;}
  .rep .r-title{font-size:27px;}
  .rep .r-item-photos{grid-template-columns:repeat(3,minmax(0,1fr));}
  .print-btn{position:fixed;right:20px;bottom:20px;background:#0F6E56;color:#fff;border:none;cursor:pointer;font-family:'Open Sans',sans-serif;font-size:13px;font-weight:700;padding:13px 20px;border-radius:999px;}
  @media print{ .print-btn{display:none!important;} body{background:#fff;padding:0;} .doc{box-shadow:none!important;border-radius:0!important;max-width:100%!important;} .rep .doc .r-page{padding:14px 4px!important;} .rep .doc .r-page + .r-page{border-top:1px solid #e4e6e2;margin-top:8px;} @page{size:A4;margin:9mm;} }
</style></head>
<body class="rep">
  <div class="doc">${S.coverOn ? p.cover : ''}${p.body}${p.notes}${signaturesPage(p.gen)}</div>
  <button class="print-btn" onclick="window.print()">Salvar como PDF</button>
  <script>window.addEventListener('load',()=>setTimeout(()=>window.print(),350));<\/script>
</body></html>`;
}

/* tópicos trazidos da visita anterior: mesmos nomes, sem apontamentos, com o histórico guardado em t.prev */
if (PREV && Array.isArray(PREV.topics)){
  S.topics = PREV.topics.map(pt => newTopic(pt.name, {
    date: PREV.date, grade: (pt.grade ?? null),
    items: (pt.items||[]).map(i => ({ text:i.text||'', photos:i.photos||[] })),
    plan: pt.plan ? { ...pt.plan, status: pt.plan.status || 'pendente' } : null
  }));
}

window.addEventListener('resize',()=>{ const b=document.querySelector('#screen .body'), h=$('app-header'); if(b&&h) b.style.paddingTop=(h.offsetHeight+16)+'px'; });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ const b=document.querySelector('#screen .body'), h=$('app-header'); if(b&&h) b.style.paddingTop=(h.offsetHeight+16)+'px'; });
render();
</script>
</body>
</html>
