<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Checklist de inspeção técnica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green-900:#0F6E56;
    --green-800:#0F6E56;
    --green-700:#1D9E75;
    --green-600:#1D9E75;
    --green-100:#e3f2ec;
    --green-50:#f5f5f5;
    --red-700:#b3352f;
    --red-100:#fbe4e2;
    --red-50:#fdf2f1;
    --ink-900:#181b19;
    --ink-700:#4d534f;
    --ink-500:#7c8480;
    --ink-300:#c7ccc8;
    --line:#e7e8e4;
    --paper:#f5f5f5;
    --card:#ffffff;
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:9px;
    --shadow-card:0 1px 2px rgba(24,27,25,0.05), 0 1px 1px rgba(24,27,25,0.03);
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    background:#ffffff;
    font-family:'Open Sans',sans-serif;
    color:var(--ink-900);
    display:flex;
    justify-content:center;
  }
  svg.icon{ display:block; flex-shrink:0; }
  button{ font-family:'Open Sans',sans-serif; cursor:pointer; }

  .app{
    width:100%;
    max-width:430px;
    height:100dvh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }

  /* ---------- header ---------- */
  .header{
    background:var(--card);
    color:var(--ink-900);
    padding:calc(env(safe-area-inset-top, 0px) + 12px) 16px 14px;
    flex-shrink:0;
    border-bottom:1px solid var(--line);
  }
  .header-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .back{ display:flex; align-items:center; gap:4px; font-size:13px; font-weight:600; color:var(--ink-700); }
  .status{ display:flex; align-items:center; gap:5px; background:var(--green-50); padding:3px 9px 3px 7px; border-radius:100px; font-size:11px; font-weight:600; color:var(--green-800); }
  .dot{ width:5px; height:5px; border-radius:50%; background:var(--green-600); }
  .header-meta{ font-size:11px; color:var(--ink-500); margin:0 0 1px; font-weight:500; }
  .header-client{ font-family:'Playfair Display',serif; font-size:16px; font-weight:600; margin:0 0 -10px; letter-spacing:-0.1px; color:var(--ink-900); }

  .progress-row{ display:flex; align-items:center; justify-content:flex-end; margin-bottom:6px; }
  .progress-label{ font-size:11.5px; font-weight:600; color:var(--ink-500); }
  .progress-track{ width:100%; height:5px; border-radius:100px; background:var(--line); overflow:hidden; }
  .progress-fill{ height:100%; border-radius:100px; background:var(--green-600); transition:width .35s ease; }

  /* ---------- body (scroll area) ---------- */
  .body{ flex:1; overflow-y:auto; padding:16px 16px 24px; -webkit-overflow-scrolling:touch; scroll-behavior:smooth; scroll-snap-type:y proximity; }

  /* ---------- cabeçalho de tópico/categoria ---------- */
  .category-header{
    display:flex; align-items:center; gap:8px;
    font-family:'Playfair Display',serif; font-size:15px; font-weight:600; color:var(--ink-900);
    margin:22px 2px 12px;
  }
  .category-header:first-child{ margin-top:2px; }
  .category-dot{ width:6px; height:6px; border-radius:50%; background:var(--green-600); flex-shrink:0; }
  .category-count{ margin-left:auto; font-size:11.5px; font-weight:600; color:var(--ink-500); }

  /* ---------- question card ---------- */
  .q-card{ background:var(--card); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); margin-bottom:20px; padding:16px; scroll-margin-top:14px; scroll-snap-align:start; transition:box-shadow .2s ease; }
  .q-card.answered{ box-shadow:0 1px 2px rgba(24,27,25,0.05), 0 1px 1px rgba(24,27,25,0.03); }
  .q-text{ font-size:14.5px; font-weight:500; line-height:1.5; margin:0 0 14px; color:var(--ink-900); }
  .q-text b{ font-weight:700; }

  .answer-row{ display:flex; gap:8px; margin-bottom:14px; }
  .answer-btn{
    flex:1; border:none; border-radius:var(--radius-sm); background:#EFEFEF; color:var(--ink-500);
    font-size:13px; font-weight:700; padding:12px 6px; text-align:center; transition:background .15s ease, color .15s ease;
  }
  .answer-btn:active{ opacity:.85; }
  .answer-btn.selected.ans-c{ background:var(--green-600); color:#fff; }
  .answer-btn.selected.ans-nc{ background:var(--red-700); color:#fff; }
  .answer-btn.selected.ans-na{ background:var(--ink-900); color:#fff; }

  .qa-divider{ border-top:1px solid var(--line); margin-bottom:14px; }

  .qa-actions{ display:flex; align-items:center; gap:8px; }
  .qa-btn{
    display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:var(--radius-sm);
    background:#fff; color:var(--ink-700); padding:9px 13px; font-size:12.5px; font-weight:700;
  }
  .qa-btn:active:not(:disabled){ border-color:var(--green-600); }
  .qa-btn:disabled{ color:var(--ink-300); border-color:#eee; cursor:not-allowed; }
  .qa-btn.active{ border-color:var(--green-600); background:var(--green-50); color:var(--green-800); }
  .qa-btn .qa-pencil{ color:var(--green-700); margin-left:2px; display:flex; align-items:center; }
  .qa-btn.plan-toggle-btn.active{ border-color:var(--green-600); background:var(--green-600); color:#fff; }
  .qa-btn.plan-toggle-btn.active .qa-pencil{ color:#fff; }

  /* ---------- painel de fotos ---------- */
  .photo-panel{ margin-top:14px; }
  .photo-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .photo-add-tile{
    width:56px; height:56px; border-radius:10px; border:1.5px dashed var(--green-600); background:transparent;
    color:var(--green-700); display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .photo-add-tile:active{ background:var(--green-50); }
  .photo-thumb{ width:56px; height:56px; border-radius:10px; position:relative; overflow:hidden; background:linear-gradient(135deg, #cfd8d3, #9fb0a8); display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.85); flex-shrink:0; }
  .photo-thumb .remove-photo{ position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:50%; background:rgba(15,20,18,0.75); border:none; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }

  /* ---------- painel de comentário ---------- */
  .comment-panel{ margin-top:14px; }
  .comment-label{ font-size:13px; font-weight:600; color:var(--ink-900); margin:0 0 8px; }
  .field-wrap{ position:relative; }
  textarea.comment-input{
    width:100%; min-height:110px; resize:vertical; border:1px solid var(--line); border-radius:var(--radius-md);
    padding:14px 16px 50px; font-family:'Open Sans',sans-serif; font-size:14px; line-height:1.5; color:var(--ink-900);
    background:#fff;
  }
  textarea.comment-input::placeholder{ color:var(--ink-500); }
  textarea.comment-input:focus{ outline:none; border-color:var(--green-600); background:var(--green-50); }
  .field-actions-row{ position:absolute; left:10px; right:10px; bottom:10px; display:flex; justify-content:flex-end; }
  .comment-mic-btn{
    width:36px; height:36px; border-radius:50%; border:none; background:#EFEFEF; color:var(--ink-700);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 1px 2px rgba(24,27,25,0.08);
  }
  .comment-mic-btn.recording{ background:var(--green-600); color:#fff; animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(29,158,117,.35); } 50%{ box-shadow:0 0 0 7px rgba(29,158,117,0); } }
  .listening{ font-size:12px; color:var(--green-600); margin:8px 2px 0; display:flex; align-items:center; gap:5px; }
  .listening span.wave{ width:5px; height:5px; border-radius:50%; background:var(--green-600); animation:blink 1s infinite ease-in-out; }
  @keyframes blink{ 0%,100%{ opacity:.3; } 50%{ opacity:1; } }

  .comment-actions-row{ display:flex; gap:10px; margin-top:12px; }
  .comment-actions-row button{ flex:1; padding:12px; border-radius:var(--radius-sm); font-size:13.5px; font-weight:700; }
  .comment-clear-btn, .photo-cancel-btn{ border:1px solid var(--line); background:#fff; color:var(--ink-700); }
  .comment-save-btn, .photo-save-btn{ border:none; background:var(--green-600); color:#fff; }
  .comment-save-btn:disabled, .photo-save-btn:disabled{ background:var(--ink-300); cursor:not-allowed; }

  /* ---------- gerar plano de ação (botão com toque de IA) ---------- */
  .plan-generate-link{
    position:relative; display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    border:1px solid transparent; border-radius:var(--radius-sm);
    background:
      linear-gradient(#fff, #fff) padding-box,
      linear-gradient(120deg, var(--green-600), var(--green-100), var(--green-600)) border-box;
    background-size: 100% 100%, 220% 220%;
    color:var(--green-700); font-size:13.5px; font-weight:700; padding:13px 16px; margin-top:14px;
    animation: ai-border-shift 4s ease-in-out infinite;
  }
  .plan-generate-link:active{
    background:
      linear-gradient(var(--green-50), var(--green-50)) padding-box,
      linear-gradient(120deg, var(--green-600), var(--green-100), var(--green-600)) border-box;
  }
  @keyframes ai-border-shift{
    0%, 100%{ background-position: 0 0, 0% 50%; }
    50%{ background-position: 0 0, 100% 50%; }
  }
  .plan-generate-link .ai-sparkle{
    display:flex; flex-shrink:0; color:var(--green-600);
    animation: ai-sparkle-pulse 1.8s ease-in-out infinite;
  }
  @keyframes ai-sparkle-pulse{
    0%, 100%{ transform:scale(1) rotate(0deg); opacity:1; }
    50%{ transform:scale(1.2) rotate(12deg); opacity:.7; }
  }

  /* ---------- resumo do plano confirmado ---------- */
  .plan-summary{ display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md); padding:12px 14px; margin-top:14px; }
  .plan-summary-icon{ width:36px; height:36px; border-radius:10px; background:var(--green-700); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .plan-summary-text{ flex:1; min-width:0; }
  .plan-summary-title{ font-size:13.5px; font-weight:700; color:var(--ink-900); margin:0; }
  .plan-summary-desc{ font-size:12px; color:var(--ink-500); font-style:italic; margin:2px 0 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .plan-edit-link{ border:none; background:transparent; color:var(--green-700); font-size:13px; font-weight:700; padding:4px; flex-shrink:0; }

  .empty-hint{ text-align:center; color:var(--ink-500); font-size:13px; padding:40px 20px; line-height:1.6; }

  /* ---------- footer ---------- */
  .footer{ flex-shrink:0; padding:12px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); background:var(--paper); border-top:1px solid var(--line); }
  .review-btn{ width:100%; padding:15px; border:none; border-radius:12px; background:var(--green-900); color:#fff; font-size:15px; font-weight:700; }
  .review-btn:disabled{ background:var(--ink-300); color:#fff; cursor:not-allowed; }

  /* ---------- tela de revisão do checklist ---------- */
  .review-overlay{ position:absolute; inset:0; z-index:20; background:var(--paper); display:flex; flex-direction:column; }
  .review-header{ background:var(--green-900); padding:calc(env(safe-area-inset-top, 0px) + 12px) 16px 14px; flex-shrink:0; }
  .review-header-top{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .review-back{ display:flex; align-items:center; gap:4px; border:none; background:transparent; color:rgba(255,255,255,0.85); font-size:13px; font-weight:600; padding:4px 4px 4px 0; }
  .review-title{ font-family:'Playfair Display',serif; font-size:17px; font-weight:600; color:#fff; margin:0; }
  .review-stats{ display:flex; gap:8px; flex-wrap:nowrap; margin-top:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .review-stats::-webkit-scrollbar{ display:none; }
  .review-stat{ background:rgba(255,255,255,0.16); color:#fff; font-size:11px; font-weight:600; padding:4px 9px; border-radius:100px; flex-shrink:0; white-space:nowrap; }
  .review-body{ flex:1; overflow-y:auto; padding:16px; -webkit-overflow-scrolling:touch; }

  .review-unanswered-banner{ display:flex; align-items:center; gap:12px; background:var(--card); color:var(--ink-900); border-radius:var(--radius-md); padding:14px; margin-bottom:24px; box-shadow:var(--shadow-card); }
  .review-unanswered-banner .banner-icon{ width:34px; height:34px; border-radius:50%; background:var(--green-50); color:var(--green-700); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .review-unanswered-banner .banner-text{ flex:1; min-width:0; }
  .review-unanswered-banner .banner-title{ font-size:13.5px; font-weight:400; color:var(--ink-900); margin:0 0 2px; line-height:1.4; }
  .review-unanswered-banner .banner-link{ border:none; background:transparent; color:var(--green-700); font-weight:700; font-size:12.5px; padding:0; text-decoration:underline; }

  .review-card{ background:var(--card); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); padding:18px 18px; margin-bottom:18px; cursor:pointer; transition:box-shadow .15s ease; }
  .review-card:active{ box-shadow:none; }
  .review-card.review-card-unanswered{ box-shadow:none; background:#eef0ee; }
  .review-card.review-card-unanswered .review-q-text{ color:var(--ink-500); }
  .review-card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .review-q-text{ font-size:13.5px; font-weight:500; line-height:1.5; color:var(--ink-900); margin:0; flex:1; min-width:0; }
  .review-q-text b{ font-weight:700; }
  .review-q-text.clamp{
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .review-badge{ font-size:11px; font-weight:700; padding:4px 10px; border-radius:100px; flex-shrink:0; white-space:nowrap; }
  .review-badge-c{ background:var(--green-600); color:#fff; }
  .review-badge-nc{ background:var(--red-700); color:#fff; }
  .review-badge-na{ background:var(--ink-900); color:#fff; }
  .review-badge-none{ background:var(--ink-300); color:#fff; }
  .review-photo-row{ display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .review-photo-thumb{ width:44px; height:44px; border-radius:8px; background-size:cover; background-position:center; flex-shrink:0; }
  .review-comment-text{ font-size:12.5px; color:var(--ink-700); font-style:italic; margin:10px 0 0; line-height:1.5; }
  .review-plan-missing{ margin-top:10px; padding:10px 12px; background:var(--green-50); border-radius:var(--radius-sm); font-size:12.5px; color:var(--ink-700); }

  .review-footer{ padding:12px 16px calc(env(safe-area-inset-bottom, 0px) + 14px); border-top:1px solid var(--line); background:var(--card); flex-shrink:0; }
  .review-generate-btn{ width:100%; padding:15px; border:none; border-radius:12px; background:var(--green-700); color:#fff; font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; }

  /* ---------- loading do plano de ação ---------- */
  .plan-loading{ display:flex; align-items:center; gap:9px; margin-top:14px; padding:14px 16px; background:#fff; border:1px solid var(--line); border-radius:var(--radius-md); }
  .plan-loading .spinner{ width:15px; height:15px; flex-shrink:0; border-radius:50%; border:2px solid var(--green-100); border-top-color:var(--green-600); animation:spin .8s linear infinite; }
  .plan-loading .sparkle{ display:flex; flex-shrink:0; color:var(--green-600); }
  .plan-loading span{ font-size:13.5px; font-weight:600; color:var(--green-800); }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- bottom sheet do plano de ação (reaproveitado) ---------- */
  .sheet-overlay{ position:absolute; inset:0; background:rgba(10,20,15,0.45); display:flex; align-items:flex-end; z-index:30; }
  .sheet-panel{ background:var(--card); width:100%; max-height:86%; border-radius:20px 20px 0 0; display:flex; flex-direction:column; box-shadow:0 -6px 28px rgba(0,0,0,0.18); animation:sheet-up .22s ease-out; overflow:hidden; }
  @keyframes sheet-up{ from{ transform:translateY(28px); opacity:.5; } to{ transform:translateY(0); opacity:1; } }
  .sheet-handle{ width:36px; height:4px; background:rgba(255,255,255,0.4); border-radius:2px; margin:0 auto 12px; flex-shrink:0; }
  .sheet-header{ display:flex; flex-direction:column; padding:10px 16px 16px; background:var(--green-900); flex-shrink:0; }
  .sheet-header-row{ display:flex; align-items:flex-start; justify-content:space-between; }
  .sheet-header-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .sheet-title-wrap{ display:flex; align-items:center; gap:10px; min-width:0; }
  .sheet-title-col{ min-width:0; }
  .sheet-title{ font-family:'Playfair Display',serif; font-weight:600; font-size:16px; color:#fff; margin:0; }
  .sheet-icon-box{ display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; }
  .sheet-q-sub{ font-size:12px; color:rgba(255,255,255,0.78); margin:4px 0 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sheet-close{ border:none; background:rgba(255,255,255,0.18); color:#fff; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .sheet-close:active{ background:rgba(255,255,255,0.3); }
  .sheet-delete-btn{ border:none; background:var(--red-50); color:var(--red-700); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .sheet-delete-btn:active{ background:var(--red-100); }
  .sheet-steps{ display:flex; align-items:center; padding:14px 16px 4px; flex-shrink:0; }
  .sheet-back-row{ padding:10px 16px 0; flex-shrink:0; }
  .step-content{ animation: step-fade-in .28s ease; }
  @keyframes step-fade-in{
    from{ opacity:0; transform:translateX(10px); }
    to{ opacity:1; transform:translateX(0); }
  }
  .step-circle{
    width:20px; height:20px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    border:2px solid var(--line); background:#fff; color:transparent; transition:all .2s ease;
  }
  .step-circle.current{ border-color:var(--green-600); }
  .step-circle.current::after{ content:''; width:8px; height:8px; border-radius:50%; background:var(--green-600); }
  .step-circle.done{ border-color:var(--green-600); background:var(--green-600); color:#fff; }
  .step-connector{ flex:1; height:2px; background:var(--line); margin:0 4px; }
  .step-connector.done{ background:var(--green-600); }
  .sheet-body{ padding:16px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .sheet-footer{ padding:12px 16px calc(env(safe-area-inset-bottom, 0px) + 12px); border-top:1px solid var(--line); flex-shrink:0; background:var(--card); }

  .sheet-loading{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:36px 20px 24px; text-align:center; }
  .sheet-loading .spinner-lg{ width:28px; height:28px; border-radius:50%; border:3px solid var(--green-100); border-top-color:var(--green-600); animation:spin .8s linear infinite; }
  .sheet-loading p{ font-size:13.5px; color:var(--ink-700); margin:0; line-height:1.5; }
  .report-loading{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; }
  .report-loading .spinner-lg{ width:28px; height:28px; border-radius:50%; border:3px solid var(--green-100); border-top-color:var(--green-600); animation:spin .8s linear infinite; }
  .report-loading p{ font-size:13.5px; color:var(--ink-700); margin:0; }

  .plan-field{ margin-bottom:16px; }
  .plan-label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-700); margin-bottom:6px; }
  .plan-field-label-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .plan-field-label-row .plan-label{ margin-bottom:0; }
  .plan-ai-badge{ display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:600; color:var(--green-700); background:var(--green-50); padding:5px 11px; border-radius:100px; white-space:nowrap; flex-shrink:0; }
  .plan-ai-badge svg{ flex-shrink:0; }
  .plan-ai-badge.edited{ color:var(--ink-500); background:#EFEFEF; }
  textarea.plan-input{ width:100%; min-height:96px; resize:vertical; border:1px solid var(--line); border-radius:var(--radius-md); padding:12px 14px; font-family:'Open Sans',sans-serif; font-size:14px; line-height:1.6; color:var(--ink-900); background:#fff; transition:background .15s ease, border-color .15s ease; }
  textarea.plan-input.ai-suggested{ background:var(--green-50); }
  textarea.plan-input:focus{ outline:none; border-color:var(--green-600); }
  .plan-restore{ display:inline-flex; align-items:center; gap:5px; border:none; background:transparent; color:var(--green-700); font-size:12.5px; font-weight:700; padding:0; margin:-8px 0 16px; }
  .plan-dates{ display:flex; flex-direction:column; gap:12px; margin-bottom:2px; }
  .plan-date-field{ width:100%; }
  .date-input-wrap{ position:relative; width:100%; }

  input.date-input:focus{ outline:none; border-color:var(--green-600); }

    return `<${tag} ${a}/>`;
  }).join('');
  return `<svg class="icon" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none">${inner}</svg>`;

/* ---------- modelo de checklist aplicado na tela anterior (index.html) ---------- */
(function applyActiveTemplateToHeader(){
  try{
    const raw = localStorage.getItem('checklistTemplateAtivo');
    if (!raw) return;
    const template = JSON.parse(raw);
    if (template && template.name){
      document.getElementById('header-meta').textContent = template.name;
    }
  }catch(e){ /* localStorage indisponivel ou dado invalido, mantem o texto padrão */ }
})();

/* ---------- dados de exemplo ----------
   Cada item tem uma "category" (tópico) para agrupar as perguntas na tela. */
const QUESTIONS_SEED = [
  { category:'Higiene e Segurança', text:"As instalações, os equipamentos, os móveis e os utensílios são mantidos em condições higiênico-sanitárias apropriadas?" },
  { category:'Higiene e Segurança', text:"As operações de higienização são realizadas por funcionários comprovadamente capacitados e com freqüência que garanta a manutenção dessas condições e minimize o risco de contaminação do alimento?" },
  { category:'Higiene e Segurança', text:"O descarte dos resíduos atende ao disposto em legislação específica?" },
  { category:'Higiene e Segurança', text:"Os funcionários utilizam uniformes adequados, limpos e em bom estado de conservação?" },
  { category:'Higiene e Segurança', text:"Existe controle de pragas e vetores atualizado e em conformidade com a legislação vigente?" },
  { category:'Armazenamento e Controle', text:"Os produtos são armazenados obedecendo ao distanciamento mínimo necessário para garantir adequada ventilação, limpeza e circulação?" },
  { category:'Armazenamento e Controle', text:"Os equipamentos e utensílios utilizados para pesagem, medição e controle de temperatura são calibrados periodicamente?" },
  { category:'Armazenamento e Controle', text:"As matérias-primas e ingredientes são armazenados seguindo o critério de validade (FIFO/FEFO)?" }
];

/* ---------- state ---------- */
let questions = QUESTIONS_SEED.map((item, i) => newQuestion(i + 1, item.category, item.text));
let deletePlanTarget = null;   // questionId | null
let activePlanSheet = null;    // questionId | null
let lastUsedEndDate = '';      // última data de conclusão confirmada — usada para pré-preencher o próximo plano de ação
let planSheetStep = 'text';    // 'text' | 'dates'
let planTextWarning = false;
let reviewOpen = false;

function newQuestion(number, category, text){
  return {
    id: number,
    number,
    category,
    text,
    answer: null,          // null | 'C' | 'NC' | 'NA'
    showPhotos: false,
    showComment: false,
    photos: [],
    photoDraft: [],
    commentDraft: '',
    commentSaved: '',
    recording: false,
    planState: 'none',     // 'none' | 'generating' | 'editing' | 'confirmed'
    plan: null,
    planMissingFieldsWarning: false
  };
}

function findQuestion(id){ return questions.find(q => q.id == id); }

/* ---------- agrupamento por tópico/categoria ---------- */
function groupQuestionsByCategory(qs){
  const groups = [];
  let current = null;
  qs.forEach(q => {
    if (!current || current.category !== q.category){
      current = { category: q.category, items: [] };
      groups.push(current);
    }
    current.items.push(q);
  });
  return groups;
}

function categoryHeaderMarkup(group){
  const answered = group.items.filter(q => q.answer !== null).length;
  return `
    <div class="category-header">
      <span class="category-dot"></span>
      ${escapeHtml(group.category)}
      <span class="category-count">${answered}/${group.items.length}</span>
    </div>
  `;
}

function pad2(n){ return String(n).padStart(2,'0'); }
function todayDisplay(){ const d = new Date(); return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`; }

function maskDateInput(raw){
  const digits = (raw || '').replace(/\D/g, '').slice(0, 8);
  const day = digits.slice(0, 2), month = digits.slice(2, 4), year = digits.slice(4, 8);
  let out = day;
  if (digits.length > 2) out += '/' + month;
  if (digits.length > 4) out += '/' + year;
  return out;
}
function parseDisplayDate(str){
  const m = /^(\d{2})\/(\d{2})\/(\d{2}|\d{4})$/.exec((str || '').trim());
  if (!m) return null;
  const day = Number(m[1]), month = Number(m[2]) - 1;
  const year = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]);
  const date = new Date(year, month, day);
  if (date.getFullYear() !== year || date.getMonth() !== month || date.getDate() !== day) return null;
  return date;
}

function generateAISuggestion(){
  return {
    whatToFix: 'Reorganizar o armazenamento seguindo o padrão FIFO, separando itens por validade.',
    howToFix: 'Treinar a equipe e reetiquetar as prateleiras com data de validade visível.'
  };
}

/* ---------- captura/seleção de foto real ---------- */
let pendingPhotoQuestionId = null;

function openPhotoPicker(qId, resetDraft){
  const q = findQuestion(qId);
  if (!q) return;
  if (resetDraft) q.photoDraft = q.photos.slice();
  pendingPhotoQuestionId = qId;
  const input = document.getElementById('photo-file-input');
  input.value = '';
  input.click();
}

function readFileAsDataUrl(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('photo-file-input').addEventListener('change', (e) => {
  const q = findQuestion(pendingPhotoQuestionId);
  const files = Array.from(e.target.files || []);
  if (!q || files.length === 0) return;

  Promise.all(files.map(readFileAsDataUrl)).then(dataUrls => {
    q.photoDraft = (q.photoDraft || []).concat(dataUrls);
    q.showPhotos = true;
    render();
  });
});

function startPlanGeneration(q){
  q.planState = 'generating';
  activePlanSheet = q.id;
  planSheetStep = 'text';
  planTextWarning = false;
  render();
  setTimeout(() => {
    const suggestion = generateAISuggestion();
    q.plan = {
      whatToFix: suggestion.whatToFix,
      howToFix: suggestion.howToFix,
      aiWhatToFix: suggestion.whatToFix,
      aiHowToFix: suggestion.howToFix,
      savedWhatToFix: suggestion.whatToFix,
      savedHowToFix: suggestion.howToFix,
      startDate: todayDisplay(),
      endDate: lastUsedEndDate,
      savedStartDate: todayDisplay(),
      savedEndDate: lastUsedEndDate,
      dateError: false
    };
    q.planState = 'editing';
    render();
  }, 900);
}

/* ---------- render ---------- */
function render(){
  renderProgress();
  renderQuestions();
  renderModal();
  renderPlanSheet();
  renderReview();

  const answeredCount = questions.filter(q => q.answer !== null).length;
  document.getElementById('review-btn').disabled = questions.length === 0 || answeredCount < 1;
  document.getElementById('review-btn').onclick = () => { reviewOpen = true; renderReview(); };
}

function renderProgress(){
  const total = questions.length;
  const answered = questions.filter(q => q.answer !== null).length;
  const pct = total === 0 ? 0 : Math.round((answered / total) * 100);
  document.getElementById('progress-label').textContent = `${answered} de ${total} itens`;
  document.getElementById('progress-fill').style.width = pct + '%';
}

function renderQuestions(){
  const el = document.getElementById('questions-container');

  if (questions.length === 0){
    el.innerHTML = `<div class="empty-hint">Nenhum item de checklist carregado.</div>`;
    return;
  }

  const groups = groupQuestionsByCategory(questions);
  el.innerHTML = groups.map(group => `
    ${categoryHeaderMarkup(group)}
    ${group.items.map(q => renderQuestionCard(q)).join('')}
  `).join('');
  bindQuestionEvents();
}

function renderQuestionCard(q){
  const answered = q.answer !== null;

  return `
    <div class="q-card ${answered ? 'answered' : ''}" id="q-${q.id}">
      <p class="q-text"><b>${q.number}.</b> ${escapeHtml(q.text)}</p>

      <div class="answer-row">
        <button class="answer-btn ans-c ${q.answer === 'C' ? 'selected' : ''}" data-q="${q.id}" data-val="C">C</button>
        <button class="answer-btn ans-nc ${q.answer === 'NC' ? 'selected' : ''}" data-q="${q.id}" data-val="NC">N/C</button>
        <button class="answer-btn ans-na ${q.answer === 'NA' ? 'selected' : ''}" data-q="${q.id}" data-val="NA">N/A</button>
      </div>

      <div class="qa-divider"></div>

      <div class="qa-actions">
        <button class="qa-btn photo-toggle-btn ${q.showPhotos ? 'active' : ''}" data-q="${q.id}" ${answered ? '' : 'disabled'}>
          ${ICON.camera(16)} <span>(${q.photos.length})</span>${q.photos.length ? `<span class="qa-pencil">${ICON.pencil(16)}</span>` : ''}
        </button>
        <button class="qa-btn comment-toggle-btn ${q.showComment ? 'active' : ''}" data-q="${q.id}" ${answered ? '' : 'disabled'}>
          ${ICON.commentAdd(16)} <span>(${q.commentSaved ? 1 : 0})</span>${q.commentSaved ? `<span class="qa-pencil">${ICON.pencil(16)}</span>` : ''}
        </button>
        ${q.planState === 'confirmed' && q.plan ? `
          <button class="qa-btn plan-toggle-btn active" data-q="${q.id}" data-action="open-plan-sheet" aria-label="Editar plano de ação">
            ${ICON.planIcon(16)} <span class="qa-pencil">${ICON.pencil(16)}</span>
          </button>
        ` : ''}
      </div>

      ${q.showPhotos ? renderPhotoPanel(q) : ''}
      ${q.showComment ? renderCommentPanel(q) : ''}

      ${renderPlanoArea(q)}
    </div>
  `;
}

function renderPhotoPanel(q){
  return `
    <div class="photo-panel">
      <div class="photo-row">
        ${q.photoDraft.map((src, i) => `
          <div class="photo-thumb" style="background-image:url('${src}');background-size:cover;background-position:center;">
            <button class="remove-photo" data-q="${q.id}" data-idx="${i}">${ICON.x(11)}</button>
          </div>
        `).join('')}
        <button class="photo-add-tile" data-q="${q.id}" aria-label="Adicionar foto">${ICON.plus(18)}</button>
      </div>
      <div class="comment-actions-row">
        <button class="photo-cancel-btn" data-q="${q.id}">Cancelar</button>
        <button class="photo-save-btn" data-q="${q.id}">Salvar fotos</button>
      </div>
    </div>
  `;
}

function renderCommentPanel(q){
  const value = q.commentDraft;
  return `
    <div class="comment-panel">
      <p class="comment-label">Comentário</p>
      <div class="field-wrap">
        <textarea class="comment-input" placeholder="Descreva o que você observou..." data-q="${q.id}">${escapeHtml(value)}</textarea>
        <div class="field-actions-row">
          <button class="comment-mic-btn ${q.recording ? 'recording' : ''}" data-q="${q.id}" aria-label="Ditar comentário">${ICON.mic(17)}</button>
        </div>
      </div>
      ${q.recording ? `<div class="listening"><span class="wave"></span> Ouvindo...</div>` : ''}
      <div class="comment-actions-row">
        <button class="comment-clear-btn" data-q="${q.id}">Excluir</button>
        <button class="comment-save-btn" data-q="${q.id}" ${value.trim() ? '' : 'disabled'}>Salvar comentário</button>
      </div>
    </div>
  `;
}

function renderPlanoArea(q){
  if (q.planState === 'generating'){
    return `
      <div class="plan-loading">
        <div class="spinner"></div>
        <div class="sparkle">${ICON.sparkles(13)}</div>
        <span>Gerando sugestão de plano de ação...</span>
      </div>
    `;
  }

  if (q.planState === 'confirmed' && q.plan){
    return '';
  }

  if (q.answer === 'NC' && q.planState === 'none'){
    return `
      <button class="plan-generate-link" data-q="${q.id}" data-action="generate-plan">
        <span class="ai-sparkle">${ICON.sparkles(15)}</span> Gerar plano de ação com IA
      </button>
    `;
  }

  if (q.planState === 'editing' && q.plan){
    if (q.answer === 'NC'){
      return `
        <button class="plan-generate-link" data-q="${q.id}" data-action="open-plan-sheet">
          <span class="ai-sparkle">${ICON.sparkles(15)}</span> Continuar plano de ação
        </button>
      `;
    }
  }

  return '';
}

function renderDateField(qId, plan, field){
  const value = field === 'start' ? plan.startDate : plan.endDate;
  const label = field === 'start' ? 'Data de Início' : 'Data de conclusão';
  return `
    <div class="plan-date-field">
      <label class="plan-label">${label}</label>
      <div class="date-input-wrap">
        <input type="text" inputmode="numeric" class="date-input" placeholder="dd/mm/aaaa" maxlength="10"
          value="${escapeHtml(value)}" data-q="${qId}" data-field="${field}" />
        ${ICON.calendar(17)}
      </div>
      ${field === 'end' ? `<p class="plan-warning" id="date-error-${qId}" style="display:${plan.dateError ? 'block' : 'none'};">A data de conclusão não pode ser anterior à data de início.</p>` : ''}
    </div>
  `;
}

function planHasUnsavedChanges(plan){
  return plan.whatToFix !== plan.savedWhatToFix ||
         plan.howToFix !== plan.savedHowToFix ||
         plan.startDate !== plan.savedStartDate ||
         plan.endDate !== plan.savedEndDate;
}

function updateSaveButtonState(q){
  if (!q.plan || q.planState !== 'confirmed') return;
  const btn = document.getElementById(`save-${q.id}`);
  if (!btn) return;
  btn.disabled = !planHasUnsavedChanges(q.plan);
}

function renderPlanSheet(){
  const root = document.getElementById('sheet-root');
  if (!activePlanSheet){ root.innerHTML = ''; return; }

  const q = findQuestion(activePlanSheet);
  if (!q){ activePlanSheet = null; root.innerHTML = ''; return; }

  const isReady = q.planState !== 'generating' && q.plan;
  const isEditingConfirmed = q.planState === 'confirmed';

  let backRowHtml = '';
  let bodyHtml;
  let footerHtml = '';

  if (!isReady){
    bodyHtml = `
      <div class="sheet-loading">
        <div class="spinner-lg"></div>
        <p>Gerando sugestão de plano de ação com base na sua resposta...</p>
      </div>
    `;
  } else {
    const plan = q.plan;
    const onTextStep = planSheetStep === 'text';

    if (!onTextStep){
      backRowHtml = `
        <div class="sheet-back-row">
          <button class="step-back-link" data-action="prev-step" data-q="${q.id}">${ICON.arrowLeft(14)} Voltar</button>
        </div>
      `;
    }

    if (onTextStep){
      const whatChanged = plan.whatToFix !== plan.aiWhatToFix;
      const howChanged = plan.howToFix !== plan.aiHowToFix;
      const changedFromAI = whatChanged || howChanged;
      bodyHtml = `
        <div class="step-content" key="text">
          <div class="plan-field">
            <div class="plan-field-label-row">
              <label class="plan-label">O que deve ser corrigido</label>
              <span class="plan-ai-badge ${whatChanged ? 'edited' : ''}">${ICON.sparkles(11)} ${whatChanged ? 'Editado por você' : 'Sugestão da IA'}</span>
            </div>
            <textarea class="plan-input plan-what ${whatChanged ? '' : 'ai-suggested'}" data-q="${q.id}">${escapeHtml(plan.whatToFix)}</textarea>
          </div>
          <div class="plan-field">
            <div class="plan-field-label-row">
              <label class="plan-label">Como será corrigido</label>
              <span class="plan-ai-badge ${howChanged ? 'edited' : ''}">${ICON.sparkles(11)} ${howChanged ? 'Editado por você' : 'Sugestão da IA'}</span>
            </div>
            <textarea class="plan-input plan-how ${howChanged ? '' : 'ai-suggested'}" data-q="${q.id}">${escapeHtml(plan.howToFix)}</textarea>
          </div>
          <button class="plan-restore" id="restore-${q.id}" style="display:${changedFromAI ? 'inline-flex' : 'none'};" data-q="${q.id}">${ICON.arrowLeft(12)} Restaurar sugestão da IA</button>
          ${planTextWarning ? `<p class="plan-warning">Preencha os dois campos antes de continuar.</p>` : ''}
        </div>
      `;
      footerHtml = `
        <div class="sheet-footer plan-actions-row">
          ${isEditingConfirmed
            ? `<button class="plan-btn plan-delete" data-action="delete-plan" data-q="${q.id}">${ICON.trash(14)} Excluir plano</button>`
            : `<button class="plan-btn" data-action="cancel-plan" data-q="${q.id}">Cancelar</button>`}
          <button class="plan-btn plan-confirm" data-action="next-step" data-q="${q.id}">Avançar</button>
        </div>
      `;
    } else {
      bodyHtml = `
        <div class="step-content" key="dates">
          <div class="plan-dates">
            ${renderDateField(q.id, plan, 'start')}
            ${renderDateField(q.id, plan, 'end')}
          </div>
          ${q.planMissingFieldsWarning ? `<p class="plan-warning">Preencha todos os campos antes de salvar.</p>` : ''}
        </div>
      `;

      if (isEditingConfirmed){
        const changed = planHasUnsavedChanges(q.plan);
        footerHtml = `
          <div class="sheet-footer plan-actions-row">
            <button class="plan-btn plan-delete" data-action="delete-plan" data-q="${q.id}">${ICON.trash(14)} Excluir plano</button>
            <button class="plan-btn plan-confirm" id="save-${q.id}" data-action="confirm-plan" ${changed ? '' : 'disabled'} data-q="${q.id}">Salvar alterações</button>
          </div>
        `;
      } else {
        footerHtml = `
          <div class="sheet-footer">
            <button class="plan-btn plan-confirm" data-action="confirm-plan" data-q="${q.id}">Confirmar plano de ação</button>
          </div>
        `;
      }
    }
  }

  root.innerHTML = `
    <div class="sheet-overlay" id="sheet-overlay">
      <div class="sheet-panel">
        <div class="sheet-header">
          <div class="sheet-handle"></div>
          <div class="sheet-header-row">
            <div class="sheet-title-wrap">
              <div class="sheet-icon-box">${ICON.planIcon(26)}</div>
              <div class="sheet-title-col">
                <div class="sheet-title">Plano de ação</div>
                <p class="sheet-q-sub">${q.number}. ${escapeHtml(q.text)}</p>
              </div>
            </div>
            <div class="sheet-header-actions">
              <button class="sheet-close" id="sheet-close-btn" aria-label="Fechar">${ICON.close(16)}</button>
            </div>
          </div>
        </div>
        ${backRowHtml}
        <div class="sheet-body">${bodyHtml}</div>
        ${footerHtml}
      </div>
    </div>
  `;

  document.getElementById('sheet-overlay').onclick = (e) => { if (e.target.id === 'sheet-overlay') closePlanSheet(); };
  document.getElementById('sheet-close-btn').onclick = closePlanSheet;

  bindPlanEvents();
}

function openPlanSheet(qId){
  activePlanSheet = qId;
  planSheetStep = 'text';
  planTextWarning = false;
  render();
}

function closePlanSheet(){
  if (activePlanSheet){
    const q = findQuestion(activePlanSheet);
    if (q && q.planState !== 'confirmed'){
      q.planState = 'none';
      q.plan = null;
      q.planMissingFieldsWarning = false;
    } else if (q && q.planState === 'confirmed' && q.plan){
      const plan = q.plan;
      plan.whatToFix = plan.savedWhatToFix;
      plan.howToFix = plan.savedHowToFix;
      plan.startDate = plan.savedStartDate;
      plan.endDate = plan.savedEndDate;
      plan.dateError = false;
      q.planMissingFieldsWarning = false;
    }
    activePlanSheet = null;
    render();
    return;
  }
  activePlanSheet = null;
  render();
}

function renderModal(){
  const root = document.getElementById('modal-root');
  if (!deletePlanTarget){ root.innerHTML = ''; return; }

  root.innerHTML = `
    <div class="modal-overlay">
      <div class="modal-card">
        <p class="modal-title">Excluir plano de ação?</p>
        <p class="modal-text">O plano de ação criado para este item será excluído. Essa ação não pode ser desfeita.</p>
        <div class="modal-actions">
          <button id="plan-modal-cancel">Cancelar</button>
          <button class="btn-danger" id="plan-modal-confirm">Excluir plano</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('plan-modal-cancel').onclick = () => { deletePlanTarget = null; render(); };
  document.getElementById('plan-modal-confirm').onclick = () => {
    const q = findQuestion(deletePlanTarget);
    if (q){ q.planState = 'none'; q.plan = null; q.planMissingFieldsWarning = false; }
    deletePlanTarget = null;
    activePlanSheet = null;
    render();
  };
}

function escapeHtml(str){
  return (str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function reportLoadingHtml(){
  return `
    <div class="review-overlay">
      <div class="report-loading">
        <div class="spinner-lg"></div>
        <p>Gerando relatório...</p>
      </div>
    </div>
  `;
}

/* ---------- tela de revisão do checklist ---------- */
function renderReview(){
  const root = document.getElementById('review-root');
  if (!reviewOpen){ root.innerHTML = ''; return; }

  const total = questions.length;
  const answeredCount = questions.filter(q => q.answer !== null).length;
  const unansweredCount = total - answeredCount;
  const ncCount = questions.filter(q => q.answer === 'NC').length;
  const planCount = questions.filter(q => q.planState === 'confirmed' && q.plan).length;
  const groups = groupQuestionsByCategory(questions);

  root.innerHTML = `
    <div class="review-overlay">
      <div class="review-header">
        <div class="review-header-top">
          <button class="review-back" id="review-back-btn">${ICON.arrowLeft(15)} Voltar</button>
        </div>
        <p class="review-title">Revisão do checklist</p>
        <div class="review-stats">
          <span class="review-stat">${total} ite${total === 1 ? 'm' : 'ns'}</span>
          <span class="review-stat">${answeredCount} respondido${answeredCount === 1 ? '' : 's'}</span>
          <span class="review-stat">${ncCount} não conforme${ncCount === 1 ? '' : 's'}</span>
          <span class="review-stat">${planCount} plano${planCount === 1 ? '' : 's'} de ação</span>
        </div>
      </div>

      <div class="review-body">
        ${unansweredCount > 0 ? `
          <div class="review-unanswered-banner">
            <div class="banner-icon">${ICON.alert(18)}</div>
            <div class="banner-text">
              <p class="banner-title">${unansweredCount === 1 ? 'Atenção! 1 item ainda precisa ser respondido' : 'Atenção! ' + unansweredCount + ' itens ainda precisam ser respondidos'}</p>
              <button class="banner-link" data-action="goto-first-unanswered">Ver itens pendentes</button>
            </div>
          </div>
        ` : ''}

        ${groups.map(group => `
          ${categoryHeaderMarkup(group)}
          ${group.items.map(q => renderReviewCard(q)).join('')}
        `).join('')}
      </div>

      <div class="review-footer">
        <button class="review-generate-btn" id="generate-report-btn">${ICON.download(15)} Gerar relatório</button>
      </div>
    </div>
  `;

  document.getElementById('review-back-btn').onclick = () => { reviewOpen = false; renderReview(); };

  document.querySelectorAll('.review-card').forEach(card => {
    card.onclick = () => goToQuestionFromReview(card.dataset.q);
  });

  const bannerBtn = document.querySelector('[data-action="goto-first-unanswered"]');
  if (bannerBtn){
    bannerBtn.onclick = (e) => {
      e.stopPropagation();
      const firstUnanswered = questions.find(q => q.answer === null);
      if (firstUnanswered) goToQuestionFromReview(firstUnanswered.id);
    };
  }

  document.querySelectorAll('.review-card [data-action="open-plan-sheet"]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      reviewOpen = false;
      openPlanSheet(btn.dataset.q);
    };
  });

  const generateBtn = document.getElementById('generate-report-btn');
  if (generateBtn){
    generateBtn.onclick = () => {
      // TODO: a geração/envio real do relatório ainda não foi implementada.
      // Por enquanto, só mostramos o loading e voltamos para o index.
      root.innerHTML = reportLoadingHtml();
      setTimeout(() => { window.location.href = 'index.html'; }, 1600);
    };
  }
}

function renderReviewCard(q){
  const answered = q.answer !== null;
  const badgeHtml = !answered
    ? `<span class="review-badge review-badge-none">Não respondido</span>`
    : q.answer === 'C'
      ? `<span class="review-badge review-badge-c">Conforme</span>`
      : q.answer === 'NC'
        ? `<span class="review-badge review-badge-nc">Não conforme</span>`
        : `<span class="review-badge review-badge-na">Não aplicável</span>`;

  const planHtml = q.answer === 'NC'
    ? (q.planState === 'confirmed' && q.plan
        ? `
          <div class="plan-summary" style="margin-top:10px;">
            <div class="plan-summary-icon">${ICON.planIcon(16)}</div>
            <div class="plan-summary-text">
              <p class="plan-summary-title">Plano de ação</p>
              <p class="plan-summary-desc">${escapeHtml(q.plan.whatToFix)}</p>
            </div>
            <button class="plan-edit-link" data-q="${q.id}" data-action="open-plan-sheet">Editar</button>
          </div>
        `
        : `<div class="review-plan-missing">Sem plano de ação criado</div>`
      )
    : '';

  return `
    <div class="review-card ${!answered ? 'review-card-unanswered' : ''}" data-q="${q.id}">
      <div class="review-card-top">
        <p class="review-q-text ${answered ? 'clamp' : ''}"><b>${q.number}.</b> ${escapeHtml(q.text)}</p>
        ${badgeHtml}
      </div>
      ${q.photos.length ? `
        <div class="review-photo-row">
          ${q.photos.map(src => `<div class="review-photo-thumb" style="background-image:url('${src}')"></div>`).join('')}
        </div>
      ` : ''}
      ${q.commentSaved ? `<p class="review-comment-text">${escapeHtml(q.commentSaved)}</p>` : ''}
      ${planHtml}
    </div>
  `;
}

function goToQuestionFromReview(qId){
  reviewOpen = false;
  renderReview();
  setTimeout(() => {
    const el = document.getElementById(`q-${qId}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 50);
}

/* ---------- eventos: perguntas ---------- */
function bindQuestionEvents(){
  document.querySelectorAll('.answer-btn').forEach(btn => {
    btn.onclick = () => {
      const q = findQuestion(btn.dataset.q);
      const val = btn.dataset.val;
      const alreadySelected = q.answer === val;
      q.answer = alreadySelected ? null : val;
      render();
    };
  });

  document.querySelectorAll('.photo-toggle-btn').forEach(btn => {
    btn.onclick = () => {
      const q = findQuestion(btn.dataset.q);
      if (q.answer === null) return;

      if (q.showPhotos){
        q.showPhotos = false;
        render();
        return;
      }

      if (q.photos.length === 0){
        // ainda não tem foto: abre direto o seletor nativo (tirar foto ou escolher da galeria)
        openPhotoPicker(q.id, true);
        return;
      }

      q.photoDraft = q.photos.slice();
      q.showPhotos = true;
      render();
    };
  });

  document.querySelectorAll('.comment-toggle-btn').forEach(btn => {
    btn.onclick = () => {
      const q = findQuestion(btn.dataset.q);
      if (q.answer === null) return;
      if (!q.showComment && q.commentSaved) q.commentDraft = q.commentSaved;
      q.showComment = !q.showComment;
      render();
    };
  });

  document.querySelectorAll('.photo-add-tile').forEach(btn => {
    btn.onclick = () => {
      openPhotoPicker(btn.dataset.q, false);
    };
  });
  document.querySelectorAll('.remove-photo').forEach(btn => {
    btn.onclick = () => {
      const q = findQuestion(btn.dataset.q);
      q.photoDraft.splice(Number(btn.dataset.idx), 1);
      render();
    };
  });

  document.querySelectorAll('.photo-cancel-btn').forEach(btn => {
    btn.onclick = () => {
      const q = findQuestion(btn.dataset.q);
      q.photoDraft = q.photos.slice();
      q.showPhotos = false;
      render();
    };
  });
  document.querySelectorAll('.photo-save-btn').forEach(btn => {
    btn.onclick = () => {
      const q = findQuestion(btn.dataset.q);
      q.photos = q.photoDraft.slice();
      q.showPhotos = false;
      render();
    };
  });

  document.querySelectorAll('.comment-input').forEach(ta => {
    ta.oninput = () => {
      const q = findQuestion(ta.dataset.q);
      q.commentDraft = ta.value;
      const saveBtn = ta.closest('.comment-panel').querySelector('.comment-save-btn');
      if (saveBtn) saveBtn.disabled = !ta.value.trim();
    };
  });

  document.querySelectorAll('.comment-mic-btn').forEach(btn => {
    btn.onclick = () => {
      const q = findQuestion(btn.dataset.q);
      q.recording = true; render();
      setTimeout(() => {
        q.commentDraft = (q.commentDraft + ' Piso da câmara fria apresenta acúmulo de umidade próximo ao ralo.').trim();
        q.recording = false;
        render();
      }, 1300);
    };
  });

  document.querySelectorAll('.comment-clear-btn').forEach(btn => {
    btn.onclick = () => {
      const q = findQuestion(btn.dataset.q);
      q.commentDraft = '';
      q.commentSaved = '';
      q.showComment = false;
      render();
    };
  });

  document.querySelectorAll('.comment-save-btn').forEach(btn => {
    btn.onclick = () => {
      const q = findQuestion(btn.dataset.q);
      if (!q.commentDraft.trim()) return;
      q.commentSaved = q.commentDraft.trim();
      q.showComment = false;
      render();
    };
  });

  document.querySelectorAll('[data-action="generate-plan"]').forEach(btn => {
    btn.onclick = () => startPlanGeneration(findQuestion(btn.dataset.q));
  });
  document.querySelectorAll('[data-action="open-plan-sheet"]').forEach(btn => {
    btn.onclick = () => openPlanSheet(btn.dataset.q);
  });
}

/* ---------- eventos: sheet do plano ---------- */
function bindPlanEvents(){
  document.querySelectorAll('.plan-what, .plan-how').forEach(ta => {
    ta.oninput = () => {
      const q = findQuestion(ta.dataset.q);
      if (!q.plan) return;
      const isWhat = ta.classList.contains('plan-what');
      if (isWhat) q.plan.whatToFix = ta.value;
      else q.plan.howToFix = ta.value;

      const fieldChanged = isWhat
        ? q.plan.whatToFix !== q.plan.aiWhatToFix
        : q.plan.howToFix !== q.plan.aiHowToFix;
      ta.classList.toggle('ai-suggested', !fieldChanged);
      const badge = ta.closest('.plan-field').querySelector('.plan-ai-badge');
      if (badge){
        badge.classList.toggle('edited', fieldChanged);
        badge.innerHTML = `${ICON.sparkles(11)} ${fieldChanged ? 'Editado por você' : 'Sugestão da IA'}`;
      }

      const changedFromAI = q.plan.whatToFix !== q.plan.aiWhatToFix || q.plan.howToFix !== q.plan.aiHowToFix;
      const restoreBtn = document.getElementById(`restore-${q.id}`);
      if (restoreBtn) restoreBtn.style.display = changedFromAI ? 'inline-flex' : 'none';

      if (planTextWarning && q.plan.whatToFix.trim() && q.plan.howToFix.trim()){
        planTextWarning = false;
        const warningEl = ta.closest('.sheet-body').querySelector('.plan-warning');
        if (warningEl) warningEl.remove();
      }

      updateSaveButtonState(q);
    };
  });

  document.querySelectorAll('.plan-restore').forEach(btn => {
    btn.onclick = () => {
      const q = findQuestion(btn.dataset.q);
      if (!q.plan) return;
      q.plan.whatToFix = q.plan.aiWhatToFix;
      q.plan.howToFix = q.plan.aiHowToFix;
      render();
    };
  });

  document.querySelectorAll('.date-input').forEach(inp => {
    inp.oninput = () => {
      const q = findQuestion(inp.dataset.q);
      if (!q.plan) return;

      const formatted = maskDateInput(inp.value);
      inp.value = formatted;
      try { inp.setSelectionRange(formatted.length, formatted.length); } catch(e){}

      if (inp.dataset.field === 'start') q.plan.startDate = formatted;
      else q.plan.endDate = formatted;

      const start = parseDisplayDate(q.plan.startDate);
      const end = parseDisplayDate(q.plan.endDate);
      const hasError = !!(start && end && end < start);
      q.plan.dateError = hasError;
      const warningEl = document.getElementById(`date-error-${q.id}`);
      if (warningEl) warningEl.style.display = hasError ? 'block' : 'none';
      if (q.planMissingFieldsWarning && q.plan.whatToFix.trim() && q.plan.howToFix.trim() && q.plan.startDate.trim() && q.plan.endDate.trim()){
        q.planMissingFieldsWarning = false;
      }

      updateSaveButtonState(q);
    };
  });

  document.querySelectorAll('.plan-delete').forEach(btn => {
    btn.onclick = () => { deletePlanTarget = btn.dataset.q; render(); };
  });

  document.querySelectorAll('[data-action="delete-plan"]').forEach(btn => {
    btn.onclick = () => { deletePlanTarget = btn.dataset.q; render(); };
  });

  document.querySelectorAll('[data-action="cancel-plan"]').forEach(btn => {
    btn.onclick = () => closePlanSheet();
  });

  document.querySelectorAll('[data-action="next-step"]').forEach(btn => {
    btn.onclick = () => {
      const q = findQuestion(btn.dataset.q);
      if (!q.plan) return;
      if (!q.plan.whatToFix.trim() || !q.plan.howToFix.trim()){
        planTextWarning = true;
        render();
        return;
      }
      planTextWarning = false;
      planSheetStep = 'dates';
      render();
    };
  });

  document.querySelectorAll('[data-action="prev-step"]').forEach(btn => {
    btn.onclick = () => {
      planSheetStep = 'text';
      render();
    };
  });

  document.querySelectorAll('[data-action="confirm-plan"]').forEach(btn => {
    btn.onclick = () => {
      const q = findQuestion(btn.dataset.q);
      if (!q.plan) return;
      const plan = q.plan;

      const missing = !plan.whatToFix.trim() || !plan.howToFix.trim() || !plan.startDate.trim() || !plan.endDate.trim();
      if (missing){ q.planMissingFieldsWarning = true; plan.dateError = false; render(); return; }

      const startDate = parseDisplayDate(plan.startDate);
      const endDate = parseDisplayDate(plan.endDate);
      if (!startDate || !endDate){ q.planMissingFieldsWarning = true; plan.dateError = false; render(); return; }
      if (endDate < startDate){ q.planMissingFieldsWarning = false; plan.dateError = true; render(); return; }

      q.planMissingFieldsWarning = false;
      plan.dateError = false;
      plan.savedWhatToFix = plan.whatToFix;
      plan.savedHowToFix = plan.howToFix;
      plan.savedStartDate = plan.startDate;
      plan.savedEndDate = plan.endDate;
      lastUsedEndDate = plan.savedEndDate; // memoriza pra pré-preencher o próximo plano de ação
      q.planState = 'confirmed';

      activePlanSheet = null;
      render();
    };
  });
}

render();
</script>
</body>
</html>
