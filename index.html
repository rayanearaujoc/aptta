<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Nova visita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green-900:#0F6E56;
    --green-800:#0F6E56;
    --green-700:#1D9E75;
    --green-600:#1D9E75;
    --green-100:#e3f2ec;
    --green-50:#f5f5f5;
    --red-700:#b3352f;
    --ink-900:#181b19;
    --ink-700:#4d534f;
    --ink-500:#7c8480;
    --ink-300:#c7ccc8;
    --line:#e7e8e4;
    --paper:#f5f5f5;
    --card:#ffffff;
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:9px;
    --shadow-card:0 1px 2px rgba(24,27,25,0.05), 0 1px 1px rgba(24,27,25,0.03);
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    background:#ffffff;
    font-family:'Open Sans',sans-serif;
    color:var(--ink-900);
    display:flex;
    justify-content:center;
  }
  svg.icon{ display:block; flex-shrink:0; }
  button{ font-family:'Open Sans',sans-serif; cursor:pointer; }

  .app{
    width:100%;
    max-width:430px;
    height:100dvh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }

  /* ---------- botão central "Nova Visita" ---------- */
  .new-visit-btn{
    display:flex; align-items:center; gap:8px;
    border:none; border-radius:100px;
    background:var(--green-700); color:#fff;
    font-size:15px; font-weight:700;
    padding:16px 28px;
  }
  .new-visit-btn:active{ background:var(--green-800); }

  /* ---------- overlay + bottom sheet do modal ---------- */
  .sheet-overlay{
    position:absolute; inset:0; background:rgba(0,0,0,0.25);
    display:flex; align-items:flex-end; justify-content:center;
    padding:8px; z-index:30;
  }
  .sheet-panel{
    background:var(--card); width:100%;
    border-radius:24px; padding:20px;
    box-shadow:0 -6px 28px rgba(0,0,0,0.18);
    animation:sheet-up .22s ease-out;
  }
  @keyframes sheet-up{ from{ transform:translateY(28px); opacity:.5; } to{ transform:translateY(0); opacity:1; } }

  .sheet-top-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:6px; }
  .sheet-title{ font-family:'Playfair Display',serif; font-size:18px; font-weight:700; color:var(--ink-900); margin:0; }
  .sheet-subtitle{ font-size:13px; color:var(--ink-500); margin:6px 0 24px; }
  .sheet-close{ border:none; background:var(--green-50); color:var(--ink-700); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .sheet-close:active{ background:var(--green-100); }

  /* ---------- opções (checklist / visita técnica) ---------- */
  .option-list{ display:flex; flex-direction:column; gap:16px; margin-bottom:24px; }
  .option-card{
    display:flex; align-items:flex-start; gap:12px;
    width:100%; text-align:left;
    border:1.5px solid var(--line); border-radius:16px;
    background:#fff; padding:16px;
    transition:background-color .18s ease, border-color .18s ease;
  }
  .option-card:active{ border-color:var(--green-600); }
  .option-card.selected{ border-color:var(--green-600); background:#EAF2EF; }

  .option-icon{
    width:36px; height:36px; border-radius:10px; flex-shrink:0;
    background:var(--green-700); color:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .option-text{ flex:1; min-width:0; }
  .option-title{ font-size:14.5px; font-weight:700; color:var(--ink-900); margin:0; }
  .option-tag{ font-size:12px; font-weight:700; color:var(--green-700); margin:2px 0 4px; }
  .option-desc{ font-size:12.5px; color:var(--ink-500); line-height:1.45; margin:0; }

  .option-radio{
    width:20px; height:20px; border-radius:50%; flex-shrink:0; margin-top:1px;
    border:2px solid var(--ink-300); display:flex; align-items:center; justify-content:center;
    transition:border-color .15s ease;
  }
  .option-card.selected .option-radio,
  .template-card.selected .option-radio{ border-color:var(--green-600); }
  .option-radio::after{
    content:''; width:10px; height:10px; border-radius:50%; background:var(--green-600);
    transform:scale(0); transition:transform .15s ease;
  }
  .option-card.selected .option-radio::after,
  .template-card.selected .option-radio::after{ transform:scale(1); }

  /* ---------- ações do modal ---------- */
  .sheet-actions{ display:flex; gap:12px; }
  .sheet-actions button{ flex:1; padding:13px; border-radius:var(--radius-sm); font-size:14px; font-weight:700; }
  .btn-cancel{ border:1px solid var(--line); background:#fff; color:var(--ink-700); }
  .btn-continue{ border:none; background:#0f6e562c; color:#7aa294; cursor:not-allowed; transition:background .15s ease, color .15s ease; }
  .btn-continue.enabled{ background:var(--green-900); color:#fff; cursor:pointer; }

  /* ---------- etapa 2: escolha de modelo (só para Checklist) ---------- */
  .sheet-back-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .step-back-link{ display:flex; align-items:center; gap:4px; border:none; background:transparent; color:var(--ink-700); font-size:13px; font-weight:600; padding:2px 2px 2px 0; }
  .sheet-title-block .sheet-subtitle{ margin-top:6px; }

  .template-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px; max-height:48vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .template-card{
    display:flex; align-items:flex-start; gap:12px;
    width:100%; text-align:left; border:none;
    border:1.5px solid var(--line); border-radius:16px; background:#fff; padding:14px;
    transition:background-color .18s ease, border-color .18s ease;
  }
  .template-card:active{ border-color:var(--green-600); }
  .template-card.selected{ border-color:var(--green-600); background:#EAF2EF; }
  .template-icon{ width:34px; height:34px; border-radius:9px; flex-shrink:0; background:var(--green-700); color:#fff; display:flex; align-items:center; justify-content:center; }
  .template-text{ flex:1; min-width:0; }
  .template-title{ font-size:13.5px; font-weight:700; color:var(--ink-900); margin:0 0 5px; }
  .template-tag{ display:inline-block; font-size:10px; font-weight:700; padding:2.5px 8px; border-radius:100px; margin:0 0 8px; white-space:nowrap; }
  .template-tag.tag-padrao{ background:#1D9E75; color:#fff; }
  .template-tag.tag-meus{ background:#000; color:#fff; }
  .template-desc{ font-size:12px; color:var(--ink-500); line-height:1.45; margin:0; }

  .new-template-card{ display:flex; align-items:center; gap:12px; border:1.5px dashed var(--ink-300); border-radius:16px; background:transparent; padding:14px; width:100%; text-align:left; }
  .new-template-card:active{ background:var(--green-50); }
  .new-template-icon{ width:34px; height:34px; border-radius:9px; flex-shrink:0; border:1.5px dashed var(--ink-300); color:var(--ink-500); display:flex; align-items:center; justify-content:center; }
  .new-template-text{ flex:1; min-width:0; }
  .new-template-title-row{ display:flex; align-items:center; gap:6px; margin:0 0 3px; }
  .new-template-title{ font-size:13.5px; font-weight:700; color:var(--ink-700); margin:0; }
  .new-template-desc{ font-size:12px; color:var(--ink-500); line-height:1.4; margin:0; }

  .wip-notice{ display:flex; align-items:flex-start; gap:8px; background:var(--green-50); color:var(--green-800); border-radius:var(--radius-sm); padding:10px 12px; margin:10px 0 0; font-size:12px; line-height:1.5; animation:sheet-up .18s ease-out; }
  .wip-notice svg{ flex-shrink:0; margin-top:1px; }
</style>
</head>
<body>

<div class="app">
  <button class="new-visit-btn" id="new-visit-btn">
    <span id="icon-plus"></span> Nova Visita
  </button>

  <div id="sheet-root"></div>
</div>

<script>
/* ---------- Hugeicons (stroke-rounded) ---------- */
function hi(paths, s){
  const inner = paths.map(([tag, attrs]) => {
    const a = Object.entries(attrs)
      .filter(([k]) => k !== 'key')
      .map(([k,v]) => `${k.replace(/[A-Z]/g, m => '-'+m.toLowerCase())}="${v}"`)
      .join(' ');
    return `<${tag} ${a}/>`;
  }).join('');
  return `<svg class="icon" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none">${inner}</svg>`;
}

const ICON = {
  plus:  (s=16) => hi([["path",{d:"M12 4V20M20 12H4",stroke:"currentColor",strokeLinecap:"round",strokeLinejoin:"round",strokeWidth:"1.5"}]], s),
  close: (s=16) => hi([["path",{d:"M18 6L6.00081 17.9992M17.9992 18L6 6.00085",stroke:"currentColor",strokeLinecap:"round",strokeLinejoin:"round",strokeWidth:"1.5"}]], s),
  arrowLeft: (s=14) => hi([["path",{d:"M15 6C15 6 9.00001 10.4189 9 12C8.99999 13.5812 15 18 15 18",stroke:"currentColor",strokeLinecap:"round",strokeLinejoin:"round",strokeWidth:"1.5"}]], s),
  info: (s=15) => hi([
    ["path",{d:"M12 8.5V12.5",stroke:"currentColor",strokeLinecap:"round",strokeLinejoin:"round",strokeWidth:"1.7"}],
    ["path",{d:"M11.9944 16H12.0034",stroke:"currentColor",strokeLinecap:"round",strokeLinejoin:"round",strokeWidth:"2"}],
    ["path",{d:"M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z",stroke:"currentColor",strokeLinecap:"round",strokeLinejoin:"round",strokeWidth:"1.7"}]
  ], s),

  /* document-validation-stroke-rounded — usado no card "Checklist" */
  checklist: (s=20) => hi([
    ["path",{d:"M14.9805 7.01556C14.9805 7.01556 15.4805 7.51556 15.9805 8.51556C15.9805 8.51556 17.5687 6.01556 18.9805 5.51556",stroke:"currentColor",strokeLinecap:"round",strokeLinejoin:"round",strokeWidth:"1.7"}],
    ["path",{d:"M9.99491 2.02134C7.49644 1.91556 5.56618 2.20338 5.56618 2.20338C4.34733 2.29053 2.01152 2.97385 2.01154 6.96454C2.01156 10.9213 1.9857 15.7993 2.01154 17.7439C2.01154 18.932 2.74716 21.7033 5.29332 21.8518C8.38816 22.0324 13.9628 22.0708 16.5205 21.8518C17.2052 21.8132 19.4847 21.2757 19.7732 18.7956C20.0721 16.2263 20.0126 14.4407 20.0126 14.0157",stroke:"currentColor",strokeLinecap:"round",strokeLinejoin:"round",strokeWidth:"1.7"}],
    ["path",{d:"M21.9999 7.01556C21.9999 9.77698 19.7592 12.0156 16.9951 12.0156C14.231 12.0156 11.9903 9.77698 11.9903 7.01556C11.9903 4.25414 14.231 2.01556 16.9951 2.01556C19.7592 2.01556 21.9999 4.25414 21.9999 7.01556Z",stroke:"currentColor",strokeLinecap:"round",strokeLinejoin:"round",strokeWidth:"1.7"}],
    ["path",{d:"M6.98053 13.0156H10.9805",stroke:"currentColor",strokeLinecap:"round",strokeLinejoin:"round",strokeWidth:"1.7"}],
    ["path",{d:"M6.98053 17.0156H14.9805",stroke:"currentColor",strokeLinecap:"round",strokeLinejoin:"round",strokeWidth:"1.7"}]
  ], s),

  /* task-edit-01-stroke-rounded — usado no card "Visita técnica" */
  freeform: (s=20) => hi([
    ["path",{d:"M13.5 2H8.5C7.67157 2 7 2.67157 7 3.5C7 4.32843 7.67157 5 8.5 5H13.5C14.3284 5 15 4.32843 15 3.5C15 2.67157 14.3284 2 13.5 2Z",stroke:"currentColor",strokeLinecap:"round",strokeLinejoin:"round",strokeWidth:"1.7"}],
    ["path",{d:"M7 15H10.4286M7 11H15",stroke:"currentColor",strokeLinecap:"round",strokeLinejoin:"round",strokeWidth:"1.7"}],
    ["path",{d:"M19 11.9995L19 9.48263C19 6.65424 19 5.24004 18.1213 4.36137C17.48 3.72007 16.5535 3.54681 15 3.5M11 21.9995L9 21.9995C6.17158 21.9995 4.75737 21.9995 3.87869 21.1208C3.00001 20.2421 3.00001 18.8279 3 15.9995L3.00001 9.48269C3.00001 6.65425 3 5.24004 3.87868 4.36136C4.51997 3.72007 5.44651 3.54681 6.9999 3.5",stroke:"currentColor",strokeLinecap:"round",strokeLinejoin:"round",strokeWidth:"1.7"}],
    ["path",{d:"M15.7367 21.6527L14 22L14.3473 20.2633C14.4179 19.9106 14.5913 19.5866 14.8456 19.3323L18.9111 15.2668C19.2668 14.9111 19.8437 14.9111 20.1995 15.2668L20.7332 15.8005C21.0889 16.1563 21.0889 16.7332 20.7332 17.0889L16.6677 21.1544C16.4134 21.4087 16.0894 21.5821 15.7367 21.6527Z",stroke:"currentColor",strokeLinecap:"round",strokeLinejoin:"round",strokeWidth:"1.7"}]
  ], s)
};

document.getElementById('icon-plus').innerHTML = ICON.plus(16);

/* ---------- destinos: ajuste os arquivos aqui se os nomes forem outros ---------- */
const DESTINATIONS = {
  checklist: 'checklist.html',
  visita: 'visita-tecnica.html'
};

/* ---------- modelos de checklist disponíveis ----------
   "padrao" = modelo padrão do sistema. "meus" = modelo criado pelo próprio usuário.
   Ajuste/puxe essa lista de onde fizer sentido quando integrar com o backend. */
const TEMPLATES = [
  { id:'padrao-limpeza',    tag:'padrao', name:'Checklist Padrão de Limpeza', desc:'Modelo padrão do sistema para avaliação de limpeza e organização das áreas de produção.' },
  { id:'padrao-auditoria',  tag:'padrao', name:'Checklist Padrão de Auditoria de Qualidade', desc:'Modelo padrão do sistema para verificação dos requisitos de qualidade e conformidade sanitária.' },
  { id:'meu-5s',            tag:'meus',   name:'Checklist Auditoria 5S', desc:'Modelo criado por você para avaliação dos princípios de organização 5S.' },
  { id:'meu-acaiteria',     tag:'meus',   name:'Checklist Diagnóstico Açaiteria', desc:'Modelo criado por você para diagnóstico completo de unidades de açaiteria.' }
];
const TEMPLATE_TAG_LABEL = { padrao:'Aptta', meus:'Meus' };

/* chave usada pelo checklist.html para saber qual modelo foi aplicado */
const ACTIVE_TEMPLATE_KEY = 'checklistTemplateAtivo';

/* ---------- persistencia do estado do modal ---------- */
const STORAGE_KEY = 'novaVisitaModalState';

function saveState(){
  try{
    if (sheetOpen){
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ open: true, step: sheetStep, selectedType, selectedTemplate }));
    } else {
      localStorage.removeItem(STORAGE_KEY);
    }
  }catch(e){ /* localStorage indisponivel, ignora */ }
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

/* ---------- state ---------- */
let sheetOpen = false;
let sheetStep = 'type';   // 'type' | 'template' -- 'template' só existe quando selectedType === 'checklist'
let selectedType = null;  // 'checklist' | 'visita' | null
let selectedTemplate = null; // id do modelo de checklist selecionado na etapa 2
let showTemplateWipNotice = false;

/* ---------- markup: etapa 1 (tipo de visita) ---------- */
function buildStepTypeMarkup(){
  return `
    <div class="sheet-top-row">
      <div>
        <p class="sheet-title">Escolha o tipo de visita</p>
        <p class="sheet-subtitle">Selecione como você deseja realizar a avaliação</p>
      </div>
      <button class="sheet-close" id="sheet-close-btn" aria-label="Fechar">${ICON.close(16)}</button>
    </div>

    <div class="option-list">
      <button class="option-card" data-type="checklist">
        <div class="option-icon">${ICON.checklist(18)}</div>
        <div class="option-text">
          <p class="option-title">Checklist</p>
          <p class="option-tag">Avaliação guiada</p>
          <p class="option-desc">Responda aos itens definidos para garantir que todos os pontos sejam verificados.</p>
        </div>
        <div class="option-radio"></div>
      </button>

      <button class="option-card" data-type="visita">
        <div class="option-icon">${ICON.freeform(18)}</div>
        <div class="option-text">
          <p class="option-title">Visita técnica</p>
          <p class="option-tag">Você define o que registrar</p>
          <p class="option-desc">Registre observações, fotos e informações relevantes conforme a visita.</p>
        </div>
        <div class="option-radio"></div>
      </button>
    </div>

    <div class="sheet-actions">
      <button class="btn-cancel" id="cancel-btn">Cancelar</button>
      <button class="btn-continue" id="continue-btn" disabled>Continuar</button>
    </div>
  `;
}

/* ---------- markup: etapa 2 (modelo de checklist) ---------- */
function templateCardMarkup(t){
  return `
    <button class="template-card" data-template="${t.id}">
      <div class="template-text">
        <p class="template-title">${t.name}</p>
        <span class="template-tag tag-${t.tag}">${TEMPLATE_TAG_LABEL[t.tag]}</span>
        <p class="template-desc">${t.desc}</p>
      </div>
      <div class="option-radio"></div>
    </button>
  `;
}

function buildStepTemplateMarkup(){
  return `
    <div class="sheet-back-row">
      <button class="step-back-link" id="template-back-btn">${ICON.arrowLeft(14)} Voltar</button>
      <button class="sheet-close" id="sheet-close-btn" aria-label="Fechar">${ICON.close(16)}</button>
    </div>
    <div class="sheet-title-block">
      <p class="sheet-title">Escolha o modelo</p>
      <p class="sheet-subtitle">Selecione o modelo de checklist que será aplicado nesta visita</p>
    </div>

    <div class="template-list">
      ${TEMPLATES.map(templateCardMarkup).join('')}

      <button class="new-template-card" id="new-template-btn">
        <div class="new-template-icon">${ICON.plus(16)}</div>
        <div class="new-template-text">
          <div class="new-template-title-row">
            <p class="new-template-title">Criar novo modelo</p>
          </div>
          <p class="new-template-desc">Você poderá montar seus próprios modelos na página do seu perfil.</p>
        </div>
      </button>

      ${showTemplateWipNotice ? `
        <div class="wip-notice">${ICON.info(15)} A criação de modelos personalizados ainda está sendo implementada. Em breve isso estará disponível no seu perfil.</div>
      ` : ''}
    </div>

    <div class="sheet-actions">
      <button class="btn-cancel" id="template-cancel-btn">Cancelar</button>
      <button class="btn-continue${selectedTemplate ? ' enabled' : ''}" id="template-continue-btn" ${selectedTemplate ? '' : 'disabled'}>Continuar</button>
    </div>
  `;
}

/* Monta o markup do modal conforme a etapa atual */
function buildSheetMarkup(){
  const inner = sheetStep === 'template' ? buildStepTemplateMarkup() : buildStepTypeMarkup();
  return `
    <div class="sheet-overlay" id="sheet-overlay">
      <div class="sheet-panel">
        ${inner}
      </div>
    </div>
  `;
}

/* Atualiza so a parte da UI que depende da selecao (sem re-renderizar tudo) -- etapa 1 */
function updateSelectionUI(){
  document.querySelectorAll('.option-card').forEach(card => {
    card.classList.toggle('selected', card.dataset.type === selectedType);
  });
  const continueBtn = document.getElementById('continue-btn');
  if (continueBtn){
    const canContinue = selectedType !== null;
    continueBtn.disabled = !canContinue;
    continueBtn.classList.toggle('enabled', canContinue);
  }
}

function updateTemplateSelectionUI(){
  document.querySelectorAll('.template-card').forEach(card => {
    card.classList.toggle('selected', card.dataset.template === selectedTemplate);
  });
  const continueBtn = document.getElementById('template-continue-btn');
  if (continueBtn){
    const canContinue = selectedTemplate !== null;
    continueBtn.disabled = !canContinue;
    continueBtn.classList.toggle('enabled', canContinue);
  }
}

function goToDestination(type){
  saveState(); // guarda o modal "aberto" para quando o usuario voltar pra essa pagina
  window.location.href = DESTINATIONS[type];
}

function applyTemplateAndContinue(templateId){
  const template = TEMPLATES.find(t => t.id === templateId);
  if (!template) return;
  try{
    localStorage.setItem(ACTIVE_TEMPLATE_KEY, JSON.stringify({ id: template.id, name: template.name, tag: template.tag }));
  }catch(e){ /* localStorage indisponivel, ignora */ }
  goToDestination('checklist');
}

function render(){
  const root = document.getElementById('sheet-root');

  if (!sheetOpen){ root.innerHTML = ''; return; }

  root.innerHTML = buildSheetMarkup();

  document.getElementById('sheet-overlay').onclick = (e) => { if (e.target.id === 'sheet-overlay') closeSheet(); };
  document.getElementById('sheet-close-btn').onclick = closeSheet;

  if (sheetStep === 'template'){
    document.getElementById('template-back-btn').onclick = () => {
      sheetStep = 'type';
      selectedTemplate = null;
      showTemplateWipNotice = false;
      render();
      saveState();
    };

    document.querySelectorAll('.template-card').forEach(card => {
      card.onclick = () => {
        // clicar de novo no item já selecionado desmarca (comportamento de toggle)
        selectedTemplate = (selectedTemplate === card.dataset.template) ? null : card.dataset.template;
        updateTemplateSelectionUI();
        saveState();
      };
    });

    document.getElementById('new-template-btn').onclick = () => {
      showTemplateWipNotice = true;
      render();
    };

    document.getElementById('template-cancel-btn').onclick = closeSheet;

    document.getElementById('template-continue-btn').onclick = () => {
      if (!selectedTemplate) return;
      applyTemplateAndContinue(selectedTemplate);
    };

    updateTemplateSelectionUI();
    return;
  }

  document.getElementById('cancel-btn').onclick = closeSheet;

  document.querySelectorAll('.option-card').forEach(card => {
    card.onclick = () => {
      // clicar de novo no item já selecionado desmarca (comportamento de toggle)
      selectedType = (selectedType === card.dataset.type) ? null : card.dataset.type;
      updateSelectionUI();
      saveState();
    };
  });

  document.getElementById('continue-btn').onclick = () => {
    if (!selectedType) return;
    if (selectedType === 'checklist'){
      // checklist exige uma etapa a mais: escolher o modelo antes de seguir
      sheetStep = 'template';
      showTemplateWipNotice = false;
      render();
      saveState();
      return;
    }
    goToDestination(selectedType);
  };

  updateSelectionUI();
}

function openSheet(preSelected){
  sheetOpen = true;
  sheetStep = 'type';
  selectedType = preSelected || null;
  selectedTemplate = null;
  showTemplateWipNotice = false;
  render();
  saveState();
}

function closeSheet(){
  sheetOpen = false;
  sheetStep = 'type';
  selectedType = null;
  selectedTemplate = null;
  showTemplateWipNotice = false;
  render();
  saveState();
}

document.getElementById('new-visit-btn').onclick = () => openSheet(null);

/* ---------- restaura o modal se o usuario voltou de checklist/visita tecnica ---------- */
(function restoreOnLoad(){
  const saved = loadState();
  if (saved && saved.open){
    sheetOpen = true;
    sheetStep = saved.step === 'template' ? 'template' : 'type';
    selectedType = saved.selectedType || null;
    selectedTemplate = saved.selectedTemplate || null;
    render();
  }
})();
</script>
</body>
</html>
