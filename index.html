<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* iOS: evita o zoom automático ao tocar num campo de texto, sem mudar o tamanho das fontes.
   No iOS o "maximum-scale=1" só bloqueia esse zoom do foco; o zoom com dois dedos continua funcionando.
   Fora do iOS nada muda, para não atrapalhar quem precisa ampliar a tela. */
(function(){
  var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!ios) return;
  var m = document.querySelector('meta[name="viewport"]');
  if (m) m.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover');
})();
</script>
<title>Aptta — Consultoria Alimentar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/app.css" />
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="app" id="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="brand">
      <img src="images/logo.svg" alt="" />
      <div class="brand-text">
        <div class="brand-name">Aptta</div>
        <div class="brand-sub">Consultoria alimentar</div>
      </div>
    </div>

    <nav class="nav">
      <div class="nav-group">
        <div class="nav-label">Menu principal</div>
        <button class="nav-item" data-page="inicio" title="Início"><i data-lucide="layout-dashboard"></i><span class="label">Início</span></button>
        <button class="nav-item" data-page="clientes" title="Clientes"><i data-lucide="users"></i><span class="label">Clientes</span></button>
        <button class="nav-item" data-toggle title="Visitas"><i data-lucide="clipboard-check"></i><span class="label">Visitas</span><span class="nav-badge">3</span><i data-lucide="chevron-right" class="chev"></i></button>
        <div class="subnav">
          <a data-page="visitas-hist">Histórico de visitas</a>
          <a data-page="visitas-modelos">Modelos de checklist</a>
        </div>
        <button class="nav-item" data-page="calendario" title="Calendário"><i data-lucide="calendar-days"></i><span class="label">Calendário</span></button>
        <button class="nav-item" data-page="planos" title="Planos de ação"><i data-lucide="list-todo"></i><span class="label">Planos de ação</span><span class="nav-badge is-late">2</span></button>
        <button class="nav-item" data-page="financeiro" title="Financeiro"><i data-lucide="wallet"></i><span class="label">Financeiro</span></button>
      </div>
      <div class="nav-group">
        <div class="nav-label">Conta</div>
        <button class="nav-item" data-page="cfg" title="Configurações"><i data-lucide="settings"></i><span class="label">Configurações</span></button>
      </div>
    </nav>
    <div class="side-foot">© 2026 Aptta</div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Menu"><i data-lucide="menu"></i></button>
      <h1 class="page-title" id="pageTitle">Início</h1>
      <label class="top-search"><input type="text" placeholder="Buscar cliente, visita..." /><i data-lucide="search"></i></label>
      <div class="top-right">
        <button class="top-icon" aria-label="Notificações"><i data-lucide="bell"></i><span class="count">4</span></button>
        <button class="top-icon" aria-label="Calendário" data-page="calendario"><i data-lucide="calendar-days"></i><span class="count">2</span></button>
        <div class="top-user" id="userMenu">
          <div class="avatar">AP</div>
          <div class="who"><b>Ana Paula</b><small>ana.paula@aptta.com</small></div>
          <div class="dropdown">
            <button><i data-lucide="user"></i>Meu perfil</button>
            <button data-page="cfg"><i data-lucide="settings"></i>Configurações</button>
            <div class="sep"></div>
            <button class="danger"><i data-lucide="log-out"></i>Sair</button>
          </div>
        </div>
      </div>
    </header>

    <main id="content"></main>
  </div>

  <!-- ============ CHAT IA ============ -->
  <div class="chatbox" id="chatbox">
    <div class="chat-head">
      <div class="ic"><i data-lucide="sparkles"></i></div>
      <div><b>Assistente Aptta</b><small>Online</small></div>
      <button class="x" id="chatClose" aria-label="Fechar"><i data-lucide="x"></i></button>
    </div>
    <div class="chat-body">
      <div class="msg">Oi, Ana Paula! Posso preencher um checklist, montar o relatório de uma visita ou te dar um resumo da carteira.</div>
      <div class="chips"><button>Preencher checklist</button><button>Resumo do dia</button><button>Planos vencidos</button></div>
    </div>
    <div class="chat-foot"><input type="text" placeholder="Escreva sua mensagem..." /><button class="send" aria-label="Enviar"><i data-lucide="send-horizontal"></i></button></div>
  </div>
  <button class="fab-new" id="pageFab" type="button"></button>
  <button class="fab" id="fab" aria-label="Abrir assistente">
    <i data-lucide="sparkles" class="open-ic"></i><i data-lucide="x" class="close-ic"></i>
  </button>
  <div class="backdrop" id="backdrop"></div>
</div>

<script src="js/data.js"></script>
<script src="js/charts.js"></script>
<script src="js/shell.js"></script>
<script src="js/modelos.js"></script>
<script src="js/perfil.js"></script>
</body>
</html>
